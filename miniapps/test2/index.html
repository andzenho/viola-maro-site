<!-- Карточка ссылки. Телеграм берёт og:title и og:description; без них
     ссылка в канале и в пересылке выглядит голым адресом. Картинки нет —
     превью текстовое, как у первого теста. -->

<meta property="og:title" content="Какой вы эмпат?">
<meta property="og:description" content="Какой вы эмпат и какая сфера жизни забирает у вас больше всего. 36 утверждений, 3–5 минут.">
<meta name="twitter:card" content="summary">
<script>
/* Страховка. Если основной скрипт не разберётся или упадёт на старом браузере,
   человек увидит текст и объяснение, а не белый экран — и мы узнаем об этом.
   Здесь намеренно только ES5: этот блок обязан работать даже там, где не работает остальное.

   Стоит ВЫШЕ подключения Телеграма, и это важно: тег telegram-web-app.js грузится
   фоном и держать разбор страницы не должен. Устройство то же, что в первом тесте
   (miniapps/test/index.html), там же описано, почему так. */
(function () {
  var shown = false;
  function fallback(msg) {
    if (shown) return;
    shown = true;
    /* Причиной падения могло быть само сохранённое прохождение. Убираем сразу:
       перезагрузка после этого лечит. */
    try { localStorage.removeItem("viola2-state"); } catch (e) {}
    var box = document.getElementById("screen") || document.body;
    if (!box) return;
    box.innerHTML =
      '<div style="max-width:32rem;margin:1.5rem auto;padding:1.4rem;font:16px/1.55 system-ui,-apple-system,sans-serif;' +
      'color:#241D28;background:#fff;border:1px solid #E0D6DD;border-radius:4px">' +
      '<p style="margin:0 0 .9rem;font-size:1.2rem">Тест не открылся с первого раза</p>' +
      '<p style="margin:0 0 .9rem;color:#5C5162">Так бывает: оборвалась связь или страница не догрузилась. ' +
      'Нажмите «Открыть заново» — обычно этого хватает.</p>' +
      '<p style="margin:0 0 .9rem"><button onclick="location.reload()" ' +
      'style="font:inherit;padding:.7rem 1.1rem;color:#fff;background:#A2703C;border:0;border-radius:4px">' +
      'Открыть заново</button></p>' +
      '<p style="margin:0 0 .9rem;color:#5C5162">Не помогло — откройте ту же ссылку в обычном браузере: ' +
      '<a href="https://violamaro.ru/test2/" style="color:#A2703C">violamaro.ru/test2</a></p>' +
      '<p style="margin:0;font-size:.8rem;color:#8B7F92">Если и там не открылось, пришлите нам эту строку: ' +
      String(msg).replace(/</g, "&lt;").slice(0, 200) + '</p></div>';
  }
  window.__fallback = fallback;
  window.addEventListener("error", function (e) {
    fallback(e && e.message ? e.message : "неизвестная ошибка");
  });
  /* Скрипт у нас встроенный, ему нечего ждать. Пусто через семь секунд — значит не доехал. */
  setTimeout(function () {
    var s = document.getElementById("screen");
    if (s && !s.firstChild) fallback("пустой экран");
  }, 7000);

  /* ——— когда стартовать ———
     Тест ждёт Телеграм не дольше TG_WAIT: доехал раньше — стартуем сразу,
     не доехал — стартуем без него, как в обычном браузере. */
  var TG_WAIT = 3000;
  var tgSettled = false, appStart = null, launched = false;

  function launch() {
    if (launched || !tgSettled || !appStart) return;
    launched = true;
    appStart();
  }

  /* Телеграм опоздал к запуску — подхватываем его на ходу. */
  function lateInit() {
    var tg = window.Telegram && window.Telegram.WebApp;
    if (!tg) return;
    try {
      tg.ready();
      tg.expand();
      if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    } catch (e) {}
  }

  window.__tgSettled = function () {
    if (tgSettled) return;
    tgSettled = true;
    if (launched) lateInit(); else launch();
  };
  window.__appStart = function (fn) { appStart = fn; launch(); };
  setTimeout(window.__tgSettled, TG_WAIT);
})();
</script>

        onerror="window.__tgSettled && window.__tgSettled()"></script>

/* ——— «ваши суперспособности»: выводим из ответов, а не раздаём всем одинаково.
   Берём три самые сильные стороны — так это читается как вывод, а не как лесть.
   Перенесено из первого теста без изменений. */
function powersRanked(sc, v) {
  const list = [
    { w: sc.A,        t: "Считываете человека раньше, чем он открыл рот" },
    { w: v[1] * 3,    t: "Слышите, когда слова про одно, а человек про другое" },
    { w: v[2] * 3,    t: "Заходите в комнату и уже знаете, что тут было пять минут назад" },
    { w: sc.C,        t: "Вам рассказывают то, о чём с другими молчат" },
    { w: sc.B,        t: "Тело понимает раньше головы" },
    { w: sc.I,        t: "Растворялись в другом человеке — и собрали себя обратно" },
    { w: 9 - sc.P,    t: "Держите дистанцию и при этом не остываете к людям" },
    { w: (6 - sc.G) * 1.5, t: "Восстанавливаетесь заранее, пока ещё не накрыло" },
    { w: sc.L * 1.5,  t: "Точно знаете, от кого именно устали" }
  ];
  return list.sort((a, b) => b.w - a.w);
}
function powers(sc, v) {
  return powersRanked(sc, v).slice(0, 3).map(x => x.t);
}

/* Суперспособности для карточки. У четырёх типов эмпата и у «Считывающего» —
   те же три, что на экране. «Сочувствующему» и «Другой настройке» первый тест
   суперспособностей не показывал вовсе: при радаре 2 из 9 строка «считываете
   человека раньше, чем он открыл рот» была бы лестью. Им на карточку идёт
   только то, что стоит на твёрдых ответах; не набралось — вместо списка
   на карточке их портрет в цифрах. */
function cardPowers(r) {
  const ranked = powersRanked(r.scales, answers);
  if (r.key === "caring" || r.key === "other") return ranked.filter(x => x.w >= 6).slice(0, 3).map(x => x.t);
  return ranked.slice(0, 3).map(x => x.t);
}

/* ——— подсчёт ——— */
function inv(v) { return 3 - v; }

/* Самая просевшая сфера. Сумма двух ответов, от 0 до 6. Меньше трёх у лучшей
   из сфер — значит, не проседает ничего, и сферу не называем: выдуманный
   результат хуже, чем его отсутствие. */
function pickSphere(v, type) {
  const sums = {}, strong = {};
  SPHERES.forEach(s => { sums[s.k] = 0; strong[s.k] = 0; });
  SQ.forEach((q, i) => {
    const a = v[Q.length + i] || 0;
    sums[q.sf] += a;
    if (a === 3) strong[q.sf]++;
  });
  const keys = SPHERES.map(s => s.k);
  const max = Math.max.apply(null, keys.map(k => sums[k]));
  if (max < 3) return { key: "", sums: sums };
  let tied = keys.filter(k => sums[k] === max);
  if (tied.length > 1) {
    const named = BOL_TO_SPHERE[forks.bol];
    if (named && tied.indexOf(named) !== -1) tied = [named];
  }
  if (tied.length > 1) {
    const top = Math.max.apply(null, tied.map(k => strong[k]));
    tied = tied.filter(k => strong[k] === top);
  }
  if (tied.length > 1 && tied.indexOf(TYPE_SPHERE[type]) !== -1) tied = [TYPE_SPHERE[type]];
  return { key: tied[0], sums: sums };
}

function score() {
  const v = answers;
  const A = v[0] + v[1] + v[2];
  const P = inv(v[3]) + inv(v[5]) + inv(v[6]);
  const I = v[7] + v[8] + v[9];
  const B = v[10] + v[11] + v[12];
  const C = v[13] + v[14] + v[15] + v[16];
  const G = inv(v[18]) + v[19];
  const L = v[20] + v[21];
  const F = v[22] + v[23];
  const K = (v[4] === 3 ? 1 : 0) + (v[17] === 3 ? 1 : 0);

  const dar = A / 9;
  const prox = Math.max(P, I) / 9;
  const price = Math.max(B / 9, C / 12, I / 9);
  let pct = Math.round(dar * 40 + prox * 30 + price * 30);
  if (K === 2) pct -= 10;
  pct = Math.max(20, Math.min(97, pct));

  /* Условия и их порядок перенесены из первого теста без изменений: тип там
     и здесь обязан получаться один и тот же. Почему порядок именно такой —
     в miniapps/test/index.html. */
  let key;
  if (F >= 5 && L <= 1 && A <= 5) key = "other";
  else if (A <= 3 && C <= 4) key = "caring";
  else if (A >= 6 && P <= 3 && I <= 4 && B <= 3) key = "reader";
  else if (I >= 6 && (I - C) >= 1 && G <= 4 && K < 2) key = "awake";
  else {
    const b = B / 9, c = C / 12, g = G / 6;
    key = (c >= b && c >= g) ? "donor" : (b >= g ? "filter" : "sleeping");
  }

  const empath = EMPATH.indexOf(key) !== -1;
  const sp = pickSphere(v, key);
  return { key, pct, fon: empath && F >= 4, scales: { A, P, I, B, C, G, L, F, K },
           sphere: sp.key, spheres: sp.sums };
}

/* Какой абзац блока «Кто рядом» показать: тот, чья шкала выше остальных в долях
   от максимума. При равенстве берём шкалу, на которой стоит сам тип. */
function ryadomKey(r) {
  const sc = r.scales;
  const share = { I: sc.I / 9, B: sc.B / 9, C: sc.C / 12 };
  const max = Math.max(share.I, share.B, share.C);
  const own = { donor: "C", filter: "B", awake: "I" }[r.key];
  if (own && share[own] === max) return own;
  return ["I", "C", "B"].filter(k => share[k] === max)[0];
}

/* Ближайший поток: первое число следующего месяца по Москве. */
const MONTHS = ["января", "февраля", "марта", "апреля", "мая", "июня",
                "июля", "августа", "сентября", "октября", "ноября", "декабря"];
function stream() {
  const msk = new Date(Date.now() + 3 * 3600e3);   // Москва, UTC+3 круглый год
  const y = msk.getUTCFullYear(), m = msk.getUTCMonth();
  const start = new Date(Date.UTC(y, m + 1, 1));
  const close = new Date(Date.UTC(y, m + 1, 0));
  return {
    start: "1 " + MONTHS[start.getUTCMonth()],
    close: close.getUTCDate() + " " + MONTHS[close.getUTCMonth()]
  };
}

/* Имя из Телеграма и свои слова подставляются в разметку. Кавычка в имени
   рвала атрибут value и оставляла поле пустым — а такие имена встречаются. */
const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ESC[c]);
}
function lower1(s) { s = String(s || ""); return s.charAt(0).toLowerCase() + s.slice(1); }

/* Без replaceChildren: на неподновлённых Android его нет — падал весь скрипт. */
function render(node) {
  while (screen.firstChild) screen.removeChild(screen.firstChild);
  linksThroughTelegram_(node);
  screen.appendChild(node);
  paintDial();
  toTop();
}

/* Правовые страницы открываем средствами Телеграма: обычный target=_blank
   внутри мини-аппа на части клиентов просто не срабатывает. Ссылки на t.me
   не трогаем: их уводит openTelegramLink, и у них свои обработчики. */
function linksThroughTelegram_(node) {
  node.querySelectorAll("a").forEach(a => a.addEventListener("click", (e) => {
    const href = a.getAttribute("href");
    if (!href || href.indexOf("http") !== 0) return;
    if (href.indexOf("https://t.me/") === 0) return;
    const tg = tgApp();
    if (inTg_() && tg.openLink) { e.preventDefault(); tg.openLink(href); }
  }));
}

/* Каждый новый экран показываем с начала — иначе человек попадает
   на середину длинного текста и не понимает, что сменилось. */
function toTop() {
  try {
    window.scrollTo(0, 0);
    if (document.documentElement) document.documentElement.scrollTop = 0;
    if (document.body) document.body.scrollTop = 0;
  } catch (e) {}
}

function newPid_() {
  return "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function intro() {
  stage = "intro";
  const n = el(`
    <div class="card">
      <h1>Какой вы эмпат?</h1>
      <div class="body-copy intro-voice">
        <p>Узнаете, какой вы эмпат и какая сфера жизни забирает у вас больше всего.</p>
      </div>

      </ul>
      <div class="body-copy intro-voice">
        <p>Тут тридцать шесть утверждений. Отвечайте сразу, первым, что придёт в голову. Начнёте примерять каждое слово — получится про кого-то другого.</p>
        <p>Правильных ответов тут нет, оценивать вас никто не будет. Это <span class="nw">3–5 минут</span>.</p>

    </div>`);
  n.querySelector("#start").addEventListener("click", () => {

    pingStart_(); stage = "q"; saveState(); question();
  });
  render(n);
}

function question() {
  stage = "q";
  const q = ALL[idx];
  /* Реплика Виолы на ответ: только если на прошлое утверждение человек сказал
     «да» или «часто». На «редко» и «нет» ей отвечать нечем. */
  const prev = idx > 0 ? ALL[idx - 1] : null;
  const react = prev && prev.re && answers[idx - 1] >= 2 ? prev.re : "";
  const voice = [react, q.note].filter(Boolean).join(" ");
  const n = el(`
    <div class="card">
      ${voice ? `<p class="voice">${voice}</p>` : ""}
      <div class="step">Утверждение ${idx + 1}</div>
      <h2>${q.t}</h2>
      <div class="answers">
        ${SCALE.map((s, i) => `<button class="ans" data-v="${3 - i}">${s}</button>`).join("")}
      </div>
      ${idx > 0 ? `<button class="ghost" id="back">← Назад</button>` : ""}
    </div>`);

  n.querySelectorAll(".ans").forEach(b => b.addEventListener("click", () => {
    answers[idx] = Number(b.dataset.v);
    answers.length = idx + 1;
    idx++;
    if (idx < ALL.length) { saveState(); question(); } else { idx = 0; saveState(); fork(); }
  }));
  const back = n.querySelector("#back");
  if (back) back.addEventListener("click", () => { idx--; answers.length = idx; saveState(); question(); });
  render(n);
}

function leftWord_(nLeft) { return nLeft === 1 ? "Последний вопрос" : "Ещё " + nLeft + " вопроса"; }

function fork() {
  stage = "fork";
  const f = FORKS[idx];
  const n = el(`
    <div class="card">
      <div class="step">${leftWord_(FORKS.length - idx + 2)}</div>
      <h2>${f.q}</h2>
      <div class="answers">
        ${f.a.map((o, i) => `<button class="ans" data-i="${i}">${o[0]}</button>`).join("")}
      </div>
      <button class="ghost" id="back">← Назад</button>
    </div>`);
  n.querySelectorAll(".ans").forEach(b => b.addEventListener("click", () => {
    const pick = f.a[Number(b.dataset.i)]; forks[f.k] = pick[1]; forks[f.k + "_text"] = pick[0];
    idx++;
    saveState();
    if (idx < FORKS.length) fork(); else wordsScreen();
  }));
  n.querySelector("#back").addEventListener("click", () => {
    if (idx > 0) { idx--; saveState(); fork(); return; }
    idx = ALL.length - 1; answers.length = idx; saveState(); question();
  });
  render(n);
}

  const toChannel = n.querySelector("#channel");

    Object.keys(forks).forEach(k => { delete forks[k]; });
    clearState(); flush();   // если в прошлый раз что-то не ушло
    intro();
  });

  if (!prev) send(r);
  saveState();          // чтобы перезагрузка вернула человека на результат, а не в начало
  render(n);

  /* Полоски растут уже на экране: так видно, что это замер, а не картинка. */

  setTimeout(grow, 60);

  if (CONFIG.blocks.card) paintCard_(n, r, cardPowers(r));

}

/* ——— карточка для пересылки ———
   Рисуется на холсте и показывается картинкой: её можно сохранить долгим
   нажатием, а там, где устройство умеет, переслать вместе с текстом.
   Всегда тёмная: это отдельная вещь, а не часть экрана. */
let cardFile = null;

function wrapLines_(ctx, text, maxW) {
  const parts = String(text).split(" ");
  const lines = [];
  let line = "";
  parts.forEach(w => {
    const probe = line ? line + " " + w : w;
    if (line && ctx.measureText(probe).width > maxW) { lines.push(line); line = w; }
    else line = probe;
  });
  if (line) lines.push(line);
  return lines;
}

/* Разрядка букв: letterSpacing у холста есть не везде, рисуем по одной. */
function spaced_(ctx, text, x, y, gap) {
  let cx = x;
  for (let i = 0; i < text.length; i++) {
    const ch = text.charAt(i);
    ctx.fillText(ch, cx, y);
    cx += ctx.measureText(ch).width + gap;
  }
}

function drawCard_(r, pw) {
  const W = 1080, H = 1350, PAD = 104;
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const x = c.getContext && c.getContext("2d");
  if (!x) return null;
  const SERIF = 'Georgia, "Iowan Old Style", "Times New Roman", serif';
  const SANS = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  const INK = "#F2EBF2", SOFT = "#BCAFC2", MUTE = "#8B7F92", LINE = "#473C50", ACC = "#D9A163";
  const A = r.scales.A;

  x.fillStyle = "#1A151F";
  x.fillRect(0, 0, W, H);
  const glow = x.createRadialGradient(W * .8, 90, 30, W * .8, 90, 820);
  glow.addColorStop(0, "rgba(217,161,99,.22)");
  glow.addColorStop(1, "rgba(217,161,99,0)");
  x.fillStyle = glow;
  x.fillRect(0, 0, W, H);
  x.strokeStyle = LINE; x.lineWidth = 2;
  x.strokeRect(44, 44, W - 88, H - 88);

  x.textBaseline = "alphabetic";
  x.fillStyle = MUTE; x.font = "500 28px " + SANS;
  spaced_(x, "ВИОЛА МАРО", PAD, 142, 6);

  x.fillStyle = SOFT; x.font = "500 30px " + SANS;
  spaced_(x, "МОЙ ТИП", PAD, 248, 6);

  /* Название: в одну строку, пока влезает; дальше уменьшаем и переносим. */
  const name = RESULTS[r.key].name;
  let size = 108, lines = [];
  for (;;) {
    x.font = "400 " + size + "px " + SERIF;
    lines = wrapLines_(x, name, W - PAD * 2);
    if (lines.length === 1 || size <= 88) break;
    size -= 4;
  }
  x.fillStyle = ACC;
  let y = 248 + 30 + size;
  lines.forEach(l => { x.fillText(l, PAD, y); y += Math.round(size * 1.1); });

  y += 36;
  x.fillStyle = INK; x.font = "400 56px " + SERIF;
  x.fillText("Радар " + A + " из 9", PAD, y);
  y += 38;
  const gap = 12, tw = (W - PAD * 2 - gap * 8) / 9;
  for (let i = 0; i < 9; i++) {
    x.fillStyle = i < A ? ACC : LINE;
    x.fillRect(PAD + i * (tw + gap), y, tw, 16);
  }
  y += 16 + 76;

  x.fillStyle = SOFT; x.font = "500 28px " + SANS;
  if (!pw.length) {
    /* Суперспособностей на твёрдых ответах не набралось: показываем числа. */
    spaced_(x, "МОЙ ПОРТРЕТ В ЦИФРАХ", PAD, y, 5);
    y += 78;
    [["Фильтр", 9 - r.scales.P, 9], ["Тело", r.scales.B, 9], ["Отдаю", r.scales.C, 12]].forEach(row => {
      x.fillStyle = INK; x.font = "400 46px " + SANS;
      x.fillText(row[0], PAD, y);
      x.textAlign = "right";
      x.fillStyle = SOFT;
      x.fillText(row[1] + " из " + row[2], W - PAD, y);
      x.textAlign = "left";
      x.fillStyle = LINE; x.fillRect(PAD, y + 26, W - PAD * 2, 8);
      x.fillStyle = ACC; x.fillRect(PAD, y + 26, Math.round((W - PAD * 2) * row[1] / row[2]), 8);
      y += 118;
    });
  } else {
    spaced_(x, "МОИ СУПЕРСПОСОБНОСТИ", PAD, y, 5);
  }
  y += 62;

  /* Три строки могут не поместиться, если название ушло в две: подбираем кегль. */
  const floor = H - 218;
  const sizes = [46, 42, 38, 34, 31];
  let fs = sizes[0], lh = 62, wrapped = [];
  for (let s = 0; s < sizes.length; s++) {
    fs = sizes[s]; lh = Math.round(fs * 1.34);
    x.font = "400 " + fs + "px " + SANS;
    wrapped = pw.map(p => wrapLines_(x, p, W - PAD * 2 - 56));
    const need = wrapped.reduce((sum, ls) => sum + ls.length * lh + 22, 0);
    if (y + need - lh <= floor) break;
  }
  wrapped.forEach(ls => {
    /* Ромб вместо «✦»: глифа может не быть в системном шрифте. */
    const cy = y - fs * .34;
    x.fillStyle = ACC;
    x.beginPath();
    x.moveTo(PAD + 11, cy - 13); x.lineTo(PAD + 24, cy); x.lineTo(PAD + 11, cy + 13); x.lineTo(PAD - 2, cy);
    x.closePath(); x.fill();
    x.fillStyle = INK;
    ls.forEach(l => { x.fillText(l, PAD + 56, y); y += lh; });
    y += 22;
  });

  x.fillStyle = LINE;
  x.fillRect(PAD, H - 190, W - PAD * 2, 2);
  x.fillStyle = INK; x.font = "400 40px " + SERIF;
  x.fillText("Тест Виолы Маро", PAD, H - 122);
  x.fillStyle = MUTE; x.font = "400 30px " + SANS;
  x.textAlign = "right";
  x.fillText(CONFIG.shareShort, W - PAD, H - 122);
  x.textAlign = "left";
  return c;
}

function paintCard_(node, r, pw) {
  const img = node.querySelector("#cardimg");
  if (!img) return;
  cardFile = null;
  try {
    const c = drawCard_(r, pw);
    if (!c) throw new Error("нет холста");
    /* JPEG, а не PNG: с градиентом PNG весил 730 КБ, JPEG — впятеро меньше. */
    img.src = c.toDataURL("image/jpeg", .92);
    if (c.toBlob && typeof File === "function") {
      c.toBlob(b => {
        try { if (b) cardFile = new File([b], "moy-tip-empata.jpg", { type: "image/jpeg" }); } catch (e) {}
      }, "image/jpeg", .92);
    }
  } catch (e) {
    /* Холста нет — пересылка всё равно работает: уходит текст со ссылкой. */
    if (img.parentNode) img.parentNode.removeChild(img);
    const note = node.querySelector("#share-note");
    if (note && note.parentNode) note.parentNode.removeChild(note);
  }
}

function shareCard_(r) {
  const name = RESULTS[r.key].name;
  const link = CONFIG.shareUrl;
  const lead = "Я прошла тест Виолы Маро. Мой тип: " + name + ". ";
  event_("share");
  /* Где устройство умеет — уходит картинка вместе с текстом. */
  try {
    if (cardFile && navigator.canShare && navigator.canShare({ files: [cardFile] })) {
      navigator.share({ files: [cardFile], text: lead + "Узнайте свой: " + link }).catch(() => {});
      return;
    }
  } catch (e) {}
  /* Иначе — выбор чата в Телеграме. Он сам ставит ссылку первой строкой,
     поэтому в тексте её второй раз не повторяем. */
  const url = "https://t.me/share/url?url=" + encodeURIComponent(link) +
              "&text=" + encodeURIComponent(lead + "Узнайте свой по ссылке.");
  const tg = tgApp();
  if (inTg_() && tg.openTelegramLink) {
    try { tg.openTelegramLink(url); return; } catch (e) {}
  }
  window.open(url, "_blank", "noopener");
}

/* ——— до какого блока человек долистал ———
   В таблицу уходит самый дальний блок, не каждый по отдельности: шлём после
   паузы и когда человек уходит со страницы. Приёмник хранит максимум. */
let seenMax = -1, seenSent = -1, seenTimer = null;

function watchBlocks_(node) {
  seenMax = -1; seenSent = -1;
  if (!("IntersectionObserver" in window)) return;
  /* Считаем блок увиденным, когда его верх поднялся в верхние две трети экрана.
     По доле площади нельзя: блок программы выше экрана в несколько раз. */
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      const i = BLOCKS.indexOf(e.target.getAttribute("data-block"));
      if (i > seenMax) {
        seenMax = i;
        clearTimeout(seenTimer);
        seenTimer = setTimeout(flushSeen_, 4000);
      }
    });
  }, { rootMargin: "0px 0px -33% 0px", threshold: 0 });
  const blocks = node.querySelectorAll("[data-block]");
  for (let i = 0; i < blocks.length; i++) io.observe(blocks[i]);
}

function flushSeen_() {
  clearTimeout(seenTimer);
  if (seenMax <= seenSent) return;
  seenSent = seenMax;
  event_("scroll", BLOCKS[seenMax]);
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") flushSeen_();
});

/* ——— анкета предзаписи ——— */
function prefillForm_() {
  const u = tgUser();
  if (!form.name && u.first_name) form.name = u.first_name;
  if (!form.contact && u.username) form.contact = "@" + u.username;
  if (!form.change && words) form.change = words;
}

function fieldHtml_(f) {
  const v = form[f.id];
  if (f.type === "scale") {
    const btns = [];
    for (let i = 1; i <= 10; i++) btns.push(`<button type="button" class="chip${v === i ? " on" : ""}" data-f="${f.id}" data-v="${i}">${i}</button>`);
    return `
      <div class="field-l" data-field="${f.id}">
        <span>${f.label}</span>
        ${f.hint ? `<span class="field-hint">${f.hint}</span>` : ""}
        <div class="scale10">${btns.join("")}</div>
        <div class="scale-ends"><span>${f.lo || ""}</span><span>${f.hi || ""}</span></div>
      </div>`;
  }
  if (f.type === "one") {
    return `
      <div class="field-l" data-field="${f.id}">
        <span>${f.label}</span>
        ${f.hint ? `<span class="field-hint">${f.hint}</span>` : ""}
        <div class="chips">${f.opts.map(o => `<button type="button" class="chip${v === o ? " on" : ""}" data-f="${f.id}" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>
      </div>`;
  }
  const input = f.type === "area"
    ? `<textarea id="f-${f.id}" data-f="${f.id}" rows="3" maxlength="${f.max || 400}">${esc(v || "")}</textarea>`
    : `<input id="f-${f.id}" data-f="${f.id}" type="text" maxlength="${f.max || 80}" value="${esc(v || "")}"${f.auto ? ` autocomplete="${f.auto}"` : ' autocomplete="off"'}>`;
  return `
    <label data-field="${f.id}">${f.label}
      ${f.hint ? `<span class="field-hint">${f.hint}</span>` : ""}
      ${input}
    </label>`;
}

function formScreen() {
  stage = "form";
  const st = FORM[formStep];
  const last = formStep === FORM.length - 1;
  const n = el(`
    <div class="card">
      <div class="title-block">
        <div class="step">Анкета предзаписи · шаг ${formStep + 1} из ${FORM.length}</div>
        <h2>${st.title}</h2>
      </div>
      ${formStep === 0 ? `<p class="lede">Заполните, и сразу откроется Кабинет предзаписи с двумя бонусами. Это не оплата.</p>` : ""}
      <div class="fields">${st.fields.map(fieldHtml_).join("")}</div>
      ${st.consent ? `
        <div class="consents">
          <label class="cb" id="cb-pd-l">
            <input type="checkbox" id="cb-pd"${form.accept_pd ? " checked" : ""}>
            <span>Я даю <a href="${CONFIG.docs.consent}" target="_blank" rel="noopener">согласие</a> на обработку моих персональных данных и ознакомлен(а) с <a href="${CONFIG.docs.privacy}" target="_blank" rel="noopener">Политикой обработки персональных данных</a>.</span>
          </label>
          <label class="cb">
            <input type="checkbox" id="cb-ads"${form.accept_ads ? " checked" : ""}>
            <span>Я хочу получать письма и сообщения о программах и эфирах. Отписаться можно в один клик. <a href="${CONFIG.docs.ads}" target="_blank" rel="noopener">Условия рассылки</a></span>
          </label>
        </div>` : ""}
      <div class="foot">
        <button class="go big" id="next">${last ? "Отправить анкету" : "Дальше"}&nbsp;<span aria-hidden="true">→</span></button>
        <p class="cta-note" id="hint">${last ? "Даша из команды Виолы напишет вам один раз в Телеграм." : ""}</p>
        <button class="ghost" id="back">← Назад</button>
      </div>
    </div>`);

  const hint = n.querySelector("#hint");
  const hintText = hint.textContent;
  function warn(msg) { hint.textContent = msg; hint.classList.add("err"); }
  function calm() { hint.textContent = hintText; hint.classList.remove("err"); }

  n.querySelectorAll("input[data-f], textarea[data-f]").forEach(inp => inp.addEventListener("input", () => {
    form[inp.getAttribute("data-f")] = inp.value;
    inp.classList.remove("err");
    calm();
    saveState();
  }));
  n.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => {
    const id = c.getAttribute("data-f");
    const def = st.fields.filter(f => f.id === id)[0];
    form[id] = def && def.type === "scale" ? Number(c.getAttribute("data-v")) : c.getAttribute("data-v");
    const box = c.parentNode;
    for (let i = 0; i < box.children.length; i++) box.children[i].classList.remove("on");
    c.classList.add("on");
    box.classList.remove("err");
    calm();
    saveState();
  }));
  const pd = n.querySelector("#cb-pd");
  const pdLabel = n.querySelector("#cb-pd-l");
  const ads = n.querySelector("#cb-ads");
  if (pd) pd.addEventListener("change", () => { form.accept_pd = pd.checked; if (pd.checked) { pdLabel.classList.remove("err"); calm(); } saveState(); });
  if (ads) ads.addEventListener("change", () => { form.accept_ads = ads.checked; saveState(); });

  const btn = n.querySelector("#next");
  btn.addEventListener("click", () => {
    /* Первое незаполненное поле подсвечиваем и подводим к нему экран: подсказку
       под кнопкой человек не видит, если поле осталось выше сгиба. */
    let bad = null;
    st.fields.forEach(f => {
      const v = form[f.id];
      const empty = (f.type === "scale" || f.type === "one")
        ? !v
        : String(v || "").trim().length < (f.id === "contact" ? 3 : 2);
      if (!empty) return;
      const box = n.querySelector('[data-field="' + f.id + '"]');
      const mark = box && (box.querySelector("input, textarea, .scale10, .chips"));
      if (mark) mark.classList.add("err");
      if (!bad) bad = { f: f, box: box };
    });
    if (bad) {
      warn(bad.f.type === "scale" ? "Выберите число от 1 до 10." : "Заполните, пожалуйста: " + lower1(bad.f.label) + ".");
      if (bad.box && bad.box.scrollIntoView) bad.box.scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }
    if (!last) { formStep++; saveState(); formScreen(); return; }
    if (pd && !pd.checked) {
      /* Без согласия на обработку данных анкету принимать нельзя. */
      pdLabel.classList.add("err");
      if (pdLabel.scrollIntoView) pdLabel.scrollIntoView({ behavior: "smooth", block: "center" });
      warn("Отметьте согласие на обработку персональных данных.");
      return;
    }
    btn.disabled = true;
    btn.textContent = "Отправляю…";
    sendLead();
    leadSent = true;
    saveState();
    /* Сначала рисуем «Вы в предзаписи», потом уводим в Кабинет: на клиентах
       Телеграма старше Bot API 7.0 openTelegramLink закрывает мини-апп, и экран
       подтверждения человек бы не увидел вовсе. */
    done();
    openCabinet(true);   // обещали «сразу» — открываем сами
  });
  n.querySelector("#back").addEventListener("click", () => {
    if (formStep > 0) { formStep--; saveState(); formScreen(); return; }
    if (lastResult) result(lastResult); else intro();
  });
  render(n);
}

/* Внутри Телеграма уводим в Кабинет сразу: это его собственный переход,
   он открывается поверх и ничего не блокирует. В обычном браузере сами
   не открываем ничего — там всплывающее окно просто съедят. */
function openCabinet(auto) {
  if (!CONFIG.cabinetUrl) return;
  const tg = tgApp();
  if (inTg_() && tg.openTelegramLink) {
    try { tg.openTelegramLink(CONFIG.cabinetUrl); return; } catch (e) {}
  }
  if (!auto) window.open(CONFIG.cabinetUrl, "_blank", "noopener");
}

function done() {
  stage = "done";
  const n = el(`
    <div class="card">
      <h2>Вы в предзаписи</h2>
      <p class="lede">Оба бонуса уже ждут в закрепе Кабинета предзаписи: медитация и запись эфира.</p>
      ${CONFIG.cabinetUrl ? `
        <div class="foot">
          <a class="go big" id="cab" href="${CONFIG.cabinetUrl}" target="_blank" rel="noopener">Открыть Кабинет предзаписи&nbsp;<span aria-hidden="true">→</span></a>
          <p class="cta-note">Даша из команды Виолы напишет вам один раз в Телеграм.</p>
        </div>` : ""}
      ${lastResult ? `<button class="ghost" id="back-res">← Вернуться к результату</button>`
                   : `<button class="ghost" id="to-test">Пройти тест</button>`}
    </div>`);
  const cab = n.querySelector("#cab");
  if (cab) cab.addEventListener("click", (e) => {
    event_("cabinet");
    const tg = tgApp();
    if (inTg_() && tg.openTelegramLink) { e.preventDefault(); tg.openTelegramLink(CONFIG.cabinetUrl); }
  });
  const back = n.querySelector("#back-res");
  if (back) back.addEventListener("click", () => result(lastResult));
  /* Анкету заполнили по кнопке из бота, а результата на этом устройстве нет. */
  const toTest = n.querySelector("#to-test");
  if (toTest) toTest.addEventListener("click", () => { answers.length = 0; intro(); });
  saveState();
  render(n);
}

/* ——— откуда человек пришёл ———
   В Телеграме метка приходит в start_param: ?startapp=src_reels даёт «reels».
   Ссылка из напоминания бота, startapp=anketa_d1, открывает сразу анкету,
   и сама метка идёт в «Источник» целиком: видно, какое напоминание сработало.
   В обычном браузере метка берётся из ?src=…, так приходят по пересылке. */
function startParam_() {
  const tg = tgApp();
  let p = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || "";
  if (!p) { try { p = new URLSearchParams(location.search).get("startapp") || ""; } catch (e) {} }
  return String(p);
}
function istochnik_() {
  const p = startParam_();
  let s = "";
  if (p.indexOf("src_") === 0) s = p.slice(4);
  else if (p.indexOf("anketa") === 0) s = p;
  else { try { s = new URLSearchParams(location.search).get("src") || ""; } catch (e) {} }
  return String(s).replace(/[^\w\-]/g, "").slice(0, 40);
}

/* ——— отправка в таблицу ———
   Все записи теста 2.0 идут с test: "empat2" и form: "test2". Вторая метка —
   страховка: приёмник старой версии, который теста 2.0 ещё не знает, запись
   с неизвестной формой честно отклоняет, а не кладёт её в лист первого теста. */
const BUFFER_KEY = "viola2-pending";

function base_(type) {
  const u = tgUser();
  return {
    type: type, form: "test2", test: "empat2", pid: pid,
    userId: u.id || "",
    userLogin: u.username ? "@" + u.username : "",
    userName: [u.first_name, u.last_name].filter(Boolean).join(" "),
    istochnik: istochnik_()
  };
}

/* Пинг «открыл первый вопрос». Бот по нему отличает «не открывал тест»
   от «начал и бросил». Один раз за жизнь страницы и мимо буфера:
   потеряется — не страшно, это не лид. */
let pinged = false;
function pingStart_() {
  if (pinged || !CONFIG.sheetUrl) return;
  pinged = true;
  const u = tgUser();
  try {
    send_({ type: "start", test: "empat2", pid: pid, userId: u.id || "", istochnik: istochnik_() }).catch(() => {});
  } catch (e) {}
}

/* Данные уходят обычным GET с параметром: POST на веб-приложение Apps Script
   у анонимных запросов упирается в редирект и не доходит. Проверено на первом тесте. */
function send_(payload) {
  return fetch(CONFIG.sheetUrl + "?payload=" + encodeURIComponent(JSON.stringify(payload)), {
    keepalive: true
  });
}

/* Кладём в буфер и пробуем отправить. Не дошло — полежит и уйдёт
   при следующем открытии страницы. Иначе обрыв связи = потерянный лид. */
function queue(item) {
  buffer(item);
  flush();
}

function event_(name, block) {
  if (!CONFIG.sheetUrl || !pid) return;
  const e = base_("t2_event");
  e.event = name;
  e.block = block ? BLOCK_NAMES[block] || block : "";
  e.t = Date.now();
  queue(e);
}

function send(r) {
  const seconds = startedAt ? Math.round((Date.now() - startedAt) / 1000) : 0;
  const same = answers.length && answers.every(x => x === answers[0]);
  const p = base_("t2_result");
  p.seconds = seconds;
  p.fast = seconds > 0 && seconds < 40;   // 36 утверждений быстрее 40 секунд — читать человек не успевал
  p.monotone = same;                      // одна и та же кнопка на всё
  p.rank = r.key;
  p.percent = r.pct;
  p.scales = r.scales;
  p.sphere = r.sphere;
  p.spheres = r.spheres;
  p.age = age;
  p.words = words;
  p.forks = forks;
  p.answers = answers.slice();
  window.__result = p;
  /* Через буфер, как и анкета: обрыв связи на этом шаге иначе терял бы прохождение молча. */
  if (CONFIG.sheetUrl) queue(p);
}

function sendLead() {
  const r = lastResult || {};
  const p = base_("t2_lead");
  p.name = String(form.name || "").trim();
  p.contact = String(form.contact || "").trim();
  p.change = String(form.change || "").trim();
  p.tried = String(form.tried || "").trim();
  p.ready = form.ready || "";
  p.leader = LEADER.map(f => f.label + ": " + (form[f.id] || "")).join("\n");
  p.rank = r.key || "";
  p.sphere = r.sphere || "";
  p.age = age;
  /* Акцепт фиксируем так же, как на сайте: сами галочки, время и редакция документа. */
  p.accept_pd = form.accept_pd ? "да" : "";
  p.accept_ads = form.accept_ads ? "да" : "";
  p.consent_ts = new Date().toISOString();
  p.doc_version_consent = CONFIG.docVersionConsent || "";
  queue(p);
}

function buffer(item) {
  try {
    const all = JSON.parse(localStorage.getItem(BUFFER_KEY) || "[]");
    all.push(item);
    localStorage.setItem(BUFFER_KEY, JSON.stringify(all));
  } catch (e) {}
}

/* Вынимаем из буфера ровно одну запись — ту, что подтвердил приёмник. */
function unbuffer(item) {
  try {
    const s = JSON.stringify(item);
    const all = JSON.parse(localStorage.getItem(BUFFER_KEY) || "[]");
    const i = all.findIndex(x => JSON.stringify(x) === s);
    if (i !== -1) {
      all.splice(i, 1);
      localStorage.setItem(BUFFER_KEY, JSON.stringify(all));
    }
  } catch (e) {}
}

const inFlight = new Set();

/* Буфер чистим ТОЛЬКО после подтверждения от приёмника: дубль в таблице
   пережить можно, потерю контакта — нет. Отметки о прокрутке — не контакт:
   если приёмник их отклонил, второй раз не шлём, чтобы буфер не рос. */
function flush() {
  if (!CONFIG.sheetUrl) return;
  let all = [];
  try { all = JSON.parse(localStorage.getItem(BUFFER_KEY) || "[]"); } catch (e) { return; }
  if (!all.length) return;
  /* Обёртка не про сеть, а про сам вызов: fetch есть не в каждом вебвью. */
  try {
    all.forEach(item => {
      const key = JSON.stringify(item);
      if (inFlight.has(key)) return;     // тот же элемент уже летит — второй раз не шлём
      inFlight.add(key);
      send_(item)
        .then(res => res.text())
        .then(txt => {
          /* Приёмник отвечает {"ok":true}. Страница входа Google или отказ
             значат, что запись НЕ сохранилась: оставляем её до следующего раза. */
          if (txt.indexOf('"ok":true') !== -1 || item.type === "t2_event") unbuffer(item);
        })
        .catch(() => {})
        .then(() => { inFlight.delete(key); });
    });
  } catch (e) {}
}

/* ——— сохранение прогресса ———
   Мини-апп внутри Телеграма может перезагрузиться сам: свернули и вернулись,
   система выгрузила вкладку. Держим ответы в памяти браузера и возвращаем
   человека на то же место. */
const STATE_KEY = "viola2-state";
const TTL_MID = 24 * 3600e3;        // недопройденный тест живёт сутки
/* Готовый результат — 35 дней: бот напоминает про анкету через день, через три
   и в последние три дня месяца. Кнопка из напоминания должна привести человека
   к его результату, а не в начало теста. */
const TTL_DONE = 35 * 24 * 3600e3;

function saveState() {
  try {
    localStorage.setItem(STATE_KEY, JSON.stringify({
      v: 2, t: Date.now(), stage: stage, idx: idx,
      answers: answers.slice(), forks: forks, words: words, age: age,
      startedAt: startedAt, res: lastResult, pid: pid,
      form: form, formStep: formStep, leadSent: leadSent
    }));
  } catch (e) {}
}

function clearState() {
  /* Контакт и отметку об анкете оставляем: тот, кто проходит тест заново,
     уже в предзаписи, и второй раз анкету ему заполнять не нужно. */
  try {
    if (leadSent || form.name || form.contact) {
      localStorage.setItem(STATE_KEY, JSON.stringify({
        v: 2, t: Date.now(), stage: "intro", idx: 0, answers: [], forks: {},
        form: form, formStep: 0, leadSent: leadSent
      }));
    } else {
      localStorage.removeItem(STATE_KEY);
    }
  } catch (e) {}
}

/* Шкалы, без которых экран результата не построить. */
const SCALES_NEEDED = ["A", "P", "I", "B", "C", "G", "L"];

/* Сохранённое прохождение могло остаться от прежней версии теста. Не сошлось —
   молча начинаем заново: потерять полтора экрана ответов не так дорого,
   как сутки видеть экран «тест не открылся». */
function stateOk_(s) {
  if (s.v !== 2) return false;
  const a = s.answers;
  if (!Array.isArray(a) || a.length > ALL.length) return false;
  if (!a.every(v => typeof v === "number" && v >= 0 && v <= 3)) return false;
  if (s.res) {
    if (!RESULTS[s.res.key]) return false;
    const sc = s.res.scales;
    if (!sc || typeof sc !== "object") return false;
    if (!SCALES_NEEDED.every(k => typeof sc[k] === "number")) return false;
    if (s.res.sphere && !SPHERE[s.res.sphere]) return false;
  }
  if (s.form && typeof s.form !== "object") return false;
  return true;
}

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STATE_KEY) || "null");
    if (!s || !s.t) return null;
    const finished = (s.answers || []).length === ALL.length || s.leadSent;
    if (Date.now() - s.t > (finished ? TTL_DONE : TTL_MID)) { localStorage.removeItem(STATE_KEY); return null; }
    if (!stateOk_(s)) { localStorage.removeItem(STATE_KEY); return null; }
    return s;
  } catch (e) { return null; }
}

function boot() {
  const tg = tgApp();
  if (tg) {
    tg.ready();
    tg.expand();
    /* Экран результата длинный. Пока листаешь его вниз, Телеграм может принять
       прокрутку за жест «свернуть» и утащить приложение. Bot API 7.7+ */
    if (tg.disableVerticalSwipes) { try { tg.disableVerticalSwipes(); } catch (e) {} }
  }

  flush();   // всё, что не ушло в прошлый раз, отправляем при каждом открытии

  const wantForm = startParam_().indexOf("anketa") === 0;
  const s = loadState();

  if (s) {
    (s.answers || []).forEach(v => answers.push(v));
    Object.keys(s.forks || {}).forEach(k => { forks[k] = s.forks[k]; });
    Object.keys(s.form || {}).forEach(k => { form[k] = s.form[k]; });
    words = s.words || "";
    age = s.age || "";
    startedAt = s.startedAt || 0;
    pid = s.pid || "";
    formStep = Math.min(s.formStep || 0, FORM.length - 1);
    leadSent = !!s.leadSent;
    lastResult = s.res || null;
  }

  /* Анкета уже отправлена — показываем, где бонусы, а не тест с начала. */
  if (leadSent && (wantForm || !s || s.stage === "done" || s.stage === "form")) { done(); return; }

  /* Кнопка из напоминания бота: сразу анкета. Результата на этом устройстве
     может не быть — тогда тип и сферу приёмник возьмёт из таблицы по ID. */
  if (wantForm && !leadSent) {
    if (!pid) pid = newPid_();
    prefillForm_(); formStep = 0; formScreen();
    return;
  }

  if (!s) { intro(); return; }

  if (answers.length === ALL.length) {
    if (s.stage === "form") { formScreen(); return; }
    if (s.stage === "fork") { idx = Math.min(s.idx || 0, FORKS.length - 1); fork(); return; }
    if (s.stage === "words") { wordsScreen(); return; }
    if (s.stage === "age") { ageScreen(); return; }
    /* Аргумент обязателен: без него result() отправит прохождение в таблицу второй раз.
       Берём сохранённый вердикт — тогда тип не переиграется. Вердикта нет только
       у того, кто закрыл тест на вопросе про возраст: его и досчитываем. */
    if (lastResult) { result(lastResult); return; }
    if (age) { result(); return; }
    idx = 0; fork();
    return;
  }
  if (s.stage === "q" && answers.length) { idx = Math.min(s.idx || 0, answers.length, ALL.length - 1); question(); return; }

  answers.length = 0;
  intro();
}

/* Стартуем не сразу: страховка наверху дождётся Телеграма — или того, что его
   не будет, — и позовёт сама. Прямой вызов оставлен на случай, если верхний
   блок почему-то не отработал: без запуска тест не оставляем ни при каких условиях. */
function run() {
  try {
    boot();
  } catch (e) {
    if (window.__fallback) window.__fallback(e && e.message ? e.message : e);
  }
}

if (window.__appStart) window.__appStart(run); else run();
</script>
</html>
