<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF6EC">
<!-- Тест всегда светлый, какая бы тема ни стояла в телефоне и в Телеграме. -->
<meta name="color-scheme" content="only light">
<!-- Карточка ссылки. Телеграм берёт og:title и og:description; без них
     ссылка в канале и в пересылке выглядит голым адресом. Картинки нет —
     превью текстовое, как у первого теста. -->
<meta name="description" content="Какой вы эмпат и какая сфера жизни забирает у вас больше всего. 36 утверждений, 3–5 минут.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Виола Маро">
<meta property="og:url" content="https://violamaro.ru/test2/">
<meta property="og:title" content="Какой вы эмпат?">
<meta property="og:description" content="Какой вы эмпат и какая сфера жизни забирает у вас больше всего. 36 утверждений, 3–5 минут.">
<meta name="twitter:card" content="summary">
<script>
/* Страховка. Если основной скрипт не разберётся или упадёт на старом браузере,
   человек увидит текст и объяснение, а не белый экран — и мы узнаем об этом.
   Здесь намеренно только ES5: этот блок обязан работать даже там, где не работает остальное.

   Стоит ВЫШЕ подключения Телеграма, и это важно: тег telegram-web-app.js грузится
   фоном и держать разбор страницы не должен. Устройство то же, что в первом тесте
   (miniapps/test/index.html), там же описано, почему так. */
(function () {
  var shown = false;
  function fallback(msg) {
    if (shown) return;
    shown = true;
    /* Причиной падения могло быть само сохранённое прохождение. Убираем сразу:
       перезагрузка после этого лечит. */
    try { localStorage.removeItem("viola2-state"); } catch (e) {}
    var box = document.getElementById("screen") || document.body;
    if (!box) return;
    box.innerHTML =
      '<div style="max-width:32rem;margin:1.5rem auto;padding:1.4rem;font:16px/1.55 system-ui,-apple-system,sans-serif;' +
      'color:#241D28;background:#fff;border:1px solid #E0D6DD;border-radius:4px">' +
      '<p style="margin:0 0 .9rem;font-size:1.2rem">Тест не открылся с первого раза</p>' +
      '<p style="margin:0 0 .9rem;color:#5C5162">Так бывает: оборвалась связь или страница не догрузилась. ' +
      'Нажмите «Открыть заново» — обычно этого хватает.</p>' +
      '<p style="margin:0 0 .9rem"><button onclick="location.reload()" ' +
      'style="font:inherit;padding:.7rem 1.1rem;color:#fff;background:#A2703C;border:0;border-radius:4px">' +
      'Открыть заново</button></p>' +
      /* Раньше здесь советовали обычный браузер. С 19.10 результат приходит
         только в бот, и в браузере тест просит открыть себя в Телеграме. */
      '<p style="margin:0 0 .9rem;color:#5C5162">Не помогло? Обновите Telegram и откройте тест из бота ещё раз.</p>' +
      '<p style="margin:0;font-size:.8rem;color:#8B7F92">Если и тогда не открылось, пришлите нам эту строку: ' +
      String(msg).replace(/</g, "&lt;").slice(0, 200) + '</p></div>';
  }
  window.__fallback = fallback;
  window.addEventListener("error", function (e) {
    fallback(e && e.message ? e.message : "неизвестная ошибка");
  });
  /* Скрипт у нас встроенный, ему нечего ждать. Пусто через семь секунд — значит не доехал. */
  setTimeout(function () {
    var s = document.getElementById("screen");
    if (s && !s.firstChild) fallback("пустой экран");
  }, 7000);

  /* ——— когда стартовать ———
     Тест ждёт Телеграм не дольше TG_WAIT: доехал раньше — стартуем сразу,
     не доехал — стартуем без него, как в обычном браузере. */
  var TG_WAIT = 3000;
  var tgSettled = false, appStart = null, launched = false;

  function launch() {
    if (launched || !tgSettled || !appStart) return;
    launched = true;
    appStart();
  }

  /* Телеграм опоздал к запуску — подхватываем его на ходу. */
  function lateInit() {
    var tg = window.Telegram && window.Telegram.WebApp;
    if (!tg) return;
    try {
      tg.ready();
      tg.expand();
      if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
      if (window.__syncTheme) window.__syncTheme();
    } catch (e) {}
  }

  window.__tgSettled = function () {
    if (tgSettled) return;
    tgSettled = true;
    if (launched) lateInit(); else launch();
  };
  window.__appStart = function (fn) { appStart = fn; launch(); };
  setTimeout(window.__tgSettled, TG_WAIT);
})();
</script>
<script async src="https://telegram.org/js/telegram-web-app.js"
        onload="window.__tgSettled && window.__tgSettled()"
        onerror="window.__tgSettled && window.__tgSettled()"></script>
<title>Какой вы эмпат?</title>
<style>
  /* Вид теста 2.0, третья редакция: язык Телеграма вместо «журнального».
     Что это значит на деле:
     — один шрифт, системный гротеск; заголовки берут весом и размером,
       антиквы и курсива нет;
     — слова Виолы стоят сообщениями: аватарка, имя, пузырь — как в чате;
     — медитация и эфир выглядят постами канала: аудио с дорожкой, видео
       с обложкой; на кнопке «играть» замок, потому что материал закрыт;
     — тип человека — цветной блок, а не строка текста;
     — скругления разные по роли: блок 24, пузырь и карточка 18, кнопка
       и поле 14, метки и деления шкал круглые;
     — линеек, полосок над заголовками и черты слева у цитат нет.
     Цвета яркие, с афиши «Путь эмпата». У цвета есть смысл: красным отмечено
     то, что тест сказал про человека, и главное действие; синим — его сфера,
     неделя программы под неё и всё, что говорит Виола. Градиенты стоят там,
     где цвета много: небо в блоке типа, красная кнопка, закат на шкалах.
     Текст 18 px, мельче 15,5 px нет. Внешних запросов нет: картинки вшиты.
     Тема одна, светлая: ни системная тёмная, ни ночная в Телеграме её не меняют. */
  :root {
    /* Цвета взяты с афиши «Путь эмпата»: синее небо, красное платье и цветы,
       сливочная бумага билета, золото надписи, закатное тепло. */
    --ground: #FBF6EC;         /* сливочная бумага */
    --surface: #FFFFFF;
    --surface-2: #F4ECDD;
    --ink: #18213A;            /* чернильно-синий */
    --ink-soft: #465068;
    --ink-mute: #5F687E;
    --line: #EBDFCA;
    --line-strong: #D2C3A8;
    --accent: #D22B2B;         /* красный: значки, отметки */
    --accent-text: #B01E22;    /* тот же красный для текста */
    --accent-soft: #FDEBD3;    /* персиковая подложка */
    --gold: #F0B13F;           /* золото надписи: начало тёплых градиентов */
    /* Главная кнопка: красный градиент. Белый текст на светлом его краю 4,8:1. */
    --cta: linear-gradient(135deg, #DA352C 0%, #B3161F 100%);
    --cta-ink: #FFFFFF;
    --cta-glow: rgba(190, 30, 35, .55);
    --warn: #B01E22;
    --deep: #1F4C97;           /* синий: сфера человека, его неделя, номера шагов, имя Виолы */
    --deep-soft: #E3EDFA;
    /* Небо: блок с названием типа и блок второй кнопки. Белый текст на самом
       светлом краю 5,3:1. */
    --sky: linear-gradient(150deg, #143A85 0%, #1F56A6 55%, #2A6DB8 100%);
    --hero-ink: #FFFFFF;
    --shadow: 0 1px 2px rgba(24, 33, 58, .05), 0 10px 26px -16px rgba(24, 33, 58, .28);
    /* Тёмной темы нет намеренно: тест светлый всегда. Эта строка не даёт
       браузеру самому перекрасить поля и полосы прокрутки в тёмные. */
    color-scheme: only light;
  }


  /* Программа, тарифы и блок перед заявкой — в виде сайта violamaro.ru:
     антиква Prata в заголовках, белые карточки, красная плашка цены.
     Шрифт берём с сайта; не загрузится — встанет Georgia. */
  @font-face { font-family: "Prata"; font-style: normal; font-weight: 400; font-display: swap;
    src: url(https://violamaro.ru/assets/fonts/Prata-cyrillic.woff2) format("woff2"); unicode-range: U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: "Prata"; font-style: normal; font-weight: 400; font-display: swap;
    src: url(https://violamaro.ru/assets/fonts/Prata-latin.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+20AC, U+2122; }
  .s-sec { --s-red: #C4142C; --s-ink: #1C1A1D; --s-line: #E6E1DA; }
  .s-h2 { font-family: "Prata", Georgia, "Times New Roman", serif; font-weight: 400; font-size: 1.75rem; line-height: 1.15; letter-spacing: .01em; text-transform: uppercase; color: var(--s-ink); text-wrap: balance; }
  .s-h2::first-line { color: var(--s-red); }
  /* Сайт рамкой во всю ширину экрана, без своей прокрутки. */
  .site-wrap { padding-left: 0; padding-right: 0; }
  .site-frame { display: block; width: 100vw; max-width: 100vw; height: 1600px; margin-left: calc(50% - 50vw); border: 0; background: #EAE7E2; }
  .s-points { margin: 0 0 .6rem; padding: 0; list-style: none; display: flex; flex-direction: column; gap: .6rem; }
  .s-points li { display: flex; flex-direction: column; gap: .25rem; padding: 1rem 1rem 1.05rem; border-radius: 20px 20px 20px 6px; background: #FFFFFF; box-shadow: 0 0 0 1px var(--s-line), 0 22px 40px -28px rgba(28,26,29,.3); }
  .s-points b { font-size: 1.05rem; line-height: 1.3; color: var(--s-ink); }
  .s-points span { color: #5A5559; line-height: 1.5; }

  * { box-sizing: border-box; }
  /* Основной кегль 18 px задан на корне, в процентах: все размеры в rem
     считаются от него, а человек, увеличивший шрифт в настройках, получит
     увеличенный и здесь. */
  html { font-size: 112.5%; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 1rem;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 34rem;
    margin: 0 auto;
    padding: .8rem .9rem calc(3.5rem + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 1rem;
    min-height: 100vh;
  }

  /* — шапка: кто говорит и сколько пройдено — */
  .top { display: flex; flex-direction: column; gap: .65rem; }
  .brand { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
  .brand-who { display: flex; align-items: center; gap: .5rem; font-weight: 600; font-size: .92rem; }
  #counter { font-size: .9rem; color: var(--ink-mute); font-variant-numeric: tabular-nums; }

  /* Полоса прогресса. Нужна, пока идут утверждения; дальше её нет. */
  .bar { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--gold), #E0522F 60%, var(--accent)); transition: width .25s ease; }
  .top.quiet .bar { display: none; }

  .ava { width: 2rem; height: 2rem; border-radius: 50%; object-fit: cover; flex: none; background: var(--surface-2); }

  /* — заголовки и текст — */
  h1, h2, h3 { margin: 0; font-weight: 700; letter-spacing: -.015em; text-wrap: balance; }
  h1 { font-size: 1.9rem; line-height: 1.12; font-weight: 800; letter-spacing: -.025em; }
  h2 { font-size: 1.5rem; line-height: 1.2; }
  h3 { font-size: 1.1rem; line-height: 1.3; letter-spacing: -.005em; }
  h2 .gold { color: var(--accent-text); }

  p { margin: 0; }
  a { color: var(--accent-text); }

  .eyebrow { font-size: .9rem; font-weight: 600; line-height: 1.35; color: var(--ink-mute); }
  .head { display: flex; flex-direction: column; gap: .5rem; }

  .lead { font-size: 1.1rem; line-height: 1.45; }
  .soft { color: var(--ink-soft); }
  .fine { color: var(--ink-mute); font-size: .86rem; line-height: 1.5; }
  .center { text-align: center; }
  .nw { white-space: nowrap; }
  .hl { font-weight: 700; }
  .copy { display: flex; flex-direction: column; gap: .9rem; }
  .fine-print { display: flex; flex-direction: column; gap: .5rem; }
  .fine-print p { color: var(--ink-mute); font-size: .86rem; line-height: 1.5; }

  /* Вывод: крупно и жирно, без цвета. */
  .punch, .pull { font-size: 1.3rem; line-height: 1.3; font-weight: 700; letter-spacing: -.015em; text-wrap: balance; }
  .pull span { display: block; }

  /* — слова Виолы: сообщение в чате — */
  .msg { display: grid; grid-template-columns: 2rem 1fr; column-gap: .5rem; align-items: end; }
  .bubble {
    background: var(--surface);
    border-radius: 18px 18px 18px 6px;
    padding: .7rem .95rem .8rem;
    box-shadow: var(--shadow);
    min-width: 0;
  }
  .who { font-size: .86rem; font-weight: 700; color: var(--deep); margin-bottom: .15rem; }
  /* На карточке пузырь темнее фона карточки, иначе он с ней сливается. */
  .card .bubble { background: var(--surface-2); box-shadow: none; }

  /* Список с галочкой. */
  .checks { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: .8rem; }
  .checks li { position: relative; padding-left: 2.1rem; line-height: 1.4; }
  .checks li::before {
    content: ""; position: absolute; left: 0; top: .08em;
    width: 1.4rem; height: 1.4rem; border-radius: 50%;
    background: var(--accent-soft);
  }
  .checks li::after {
    content: ""; position: absolute; left: .5rem; top: .36em;
    width: .32rem; height: .62rem;
    border: solid var(--accent-text); border-width: 0 2.5px 2.5px 0;
    transform: rotate(45deg);
  }
  .checks b { font-weight: 700; }

  /* — карточка: один экран, один вопрос — */
  .card {
    background: var(--surface);
    border-radius: 24px;
    padding: 1.45rem 1.15rem 1.3rem;
    box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 1.2rem;
  }

  .q-text { font-size: 1.4rem; line-height: 1.25; font-weight: 700; letter-spacing: -.02em; }

  .answers { display: flex; flex-direction: column; gap: .55rem; }

  button.ans {
    appearance: none;
    text-align: left;
    font: inherit;
    color: var(--ink);
    background: var(--surface-2);
    border: 2px solid transparent;
    border-radius: 14px;
    padding: .9rem 1rem;
    min-height: 3.3rem;
    cursor: pointer;
    transition: border-color .15s ease, transform .08s ease;
  }
  button.ans:hover { border-color: var(--deep); }
  button.ans:active { transform: scale(.985); }
  /* Второй вариант ответа рядом с главной кнопкой: тот же размер, без цвета. */
  /* Шаг про Дарью: две кнопки одного размера и одной формы. Главная красная,
     вторая спокойная, без рамки при наведении: на телефоне она залипала
     синей обводкой. Высота общая и рассчитана на две строки текста. */
  .pair { display: flex; flex-direction: column; gap: .6rem; }
  .pair .go {
    display: flex; align-items: center; justify-content: center;
    min-height: 4.1rem; padding: .7rem 1rem;
    font-size: 1.02rem; text-wrap: balance;
  }
  .go.quiet { background: var(--surface-2); color: var(--ink); box-shadow: none; }
  .go.quiet:hover { filter: none; background: #EDE2CE; }

  /* Главная кнопка. */
  .go {
    appearance: none;
    display: block; width: 100%;
    font: inherit; font-weight: 700; font-size: 1.06rem; line-height: 1.25;
    text-align: center; text-decoration: none;
    color: var(--cta-ink);
    background: var(--cta);
    border: 0;
    border-radius: 14px;
    padding: 1.05rem 1.1rem;
    cursor: pointer;
    box-shadow: 0 12px 22px -14px var(--cta-glow);
    transition: transform .1s ease, filter .2s ease;
  }
  /* — плавающая кнопка анкеты на экране результата —
     Своя вёрстка, а не кнопка Телеграма: тест работает и по обычной ссылке.
     Закреплена у нижнего края и стоит по ширине основной кнопки. Под ней
     подложка в цвет фона, сходящая кверху на нет: текст страницы под кнопкой
     не рябит. Сама подложка нажатий не перехватывает, только кнопка.
     Нижний отступ учитывает полоску «домой» и в браузере, и в Телеграме. */
  .fab {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    padding: 1.5rem 1.1rem calc(.7rem + max(env(safe-area-inset-bottom, 0px), var(--tg-safe-area-inset-bottom, 0px)));
    background: linear-gradient(to top, var(--ground) 0, var(--ground) 58%, rgba(251, 246, 236, 0) 100%);
    pointer-events: none;
    opacity: 0; transform: translateY(.9rem); visibility: hidden;
    transition: opacity .28s ease, transform .28s ease, visibility 0s linear .28s;
  }
  .fab.on { opacity: 1; transform: none; visibility: visible; transition: opacity .28s ease, transform .28s ease, visibility 0s; }
  .fab .go {
    max-width: 31.8rem; margin: 0 auto; pointer-events: auto;
    font-size: 1rem; padding: .95rem .9rem;
    box-shadow: 0 14px 24px -12px var(--cta-glow), 0 2px 6px rgba(24, 33, 58, .14);
  }
  /* Надпись «Предзапись на Прикладную эмпатию 2.0» на телефоне встаёт
     в две строки: «Предзапись» и название практикума. На самых узких
     экранах кегль чуть меньше, чтобы название осталось в одной строке. */
  @media (max-width: 340px) { .fab .go { font-size: .92rem; padding-left: .5rem; padding-right: .5rem; } }
  /* Пока плавающая кнопка в работе, у страницы снизу больше воздуха:
     в самом конце кнопка не закрывает последний текст. */
  .wrap.has-fab { padding-bottom: calc(7.3rem + max(env(safe-area-inset-bottom, 0px), var(--tg-safe-area-inset-bottom, 0px))); }
  /* Кнопка «Начать» на первом экране (правка 19.10): видна сразу, без
     прокрутки, на любом телефоне. Прилипает к нижнему краю, пока под ней
     ещё есть текст, и встаёт на своё место, когда человек долистал.
     Подложка в цвет карточки, сходящая кверху на нет. */
  .start-dock {
    position: sticky; bottom: 0; z-index: 5;
    margin: -.6rem -1.15rem 0;
    padding: 1.4rem 1.15rem calc(.8rem + max(env(safe-area-inset-bottom, 0px), var(--tg-safe-area-inset-bottom, 0px)));
    background: linear-gradient(to top, var(--surface) 0, var(--surface) 62%, rgba(255, 255, 255, 0) 100%);
  }
  .go:hover { filter: brightness(1.06); }
  .go:active { transform: scale(.985); }
  .go:disabled { opacity: .6; cursor: default; }

  .ghost {
    appearance: none; font: inherit; font-size: .95rem;
    background: none; border: none; color: var(--ink-mute);
    cursor: pointer; padding: .5rem 0; text-align: left;
    align-self: flex-start;
  }
  .ghost:hover { color: var(--ink); }

  .foot { display: flex; flex-direction: column; gap: .7rem; }

  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* — анкета — */
  .fields { display: flex; flex-direction: column; gap: 1.3rem; }
  .fields label, .field-l {
    display: flex; flex-direction: column; gap: .45rem;
    font-weight: 700; line-height: 1.35;
  }
  .field-hint { font-weight: 400; font-size: .9rem; color: var(--ink-mute); line-height: 1.45; }
  /* Слова человека из теста под подсказкой: чуть темнее самой подсказки. */
  .field-note { color: var(--ink); overflow-wrap: anywhere; }
  /* Вопрос и так набран жирным, поэтому выделенное слово берёт цветом. */
  .field-l b, .fields label b { color: var(--warn); }
  .fields input, .fields textarea {
    font: inherit; font-weight: 400; color: var(--ink);
    background: var(--surface-2);
    border: 2px solid transparent;
    border-radius: 14px;
    padding: .85rem .95rem;
    width: 100%;
  }
  .fields textarea { resize: vertical; min-height: 5.6rem; line-height: 1.5; }
  .fields input:focus, .fields textarea:focus { border-color: var(--deep); outline: none; }
  .fields .err { border-color: var(--warn); }

  /* Шкала готовности 1–10: две строки по пять, чтобы в кнопку попадал палец.
     Плитки теплеют от золота к красному, как деления шкал в результате.
     Выбранная залита своим цветом и приподнята, плитки до неё залиты
     посветлее: шкала читается как наполненная до выбранной цифры.
     Цвета каждой плитки приходят из SCALE10 через --c, --m, --t, --k. */
  .scale10 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: .5rem; padding: .25rem 0; }
  .scale10.err { outline: 2px solid var(--warn); outline-offset: 4px; border-radius: 14px; }
  /* Пропущенный вопрос с вариантами отмечается так же, как пропущенная шкала. */
  .chips.err { outline: 2px solid var(--warn); outline-offset: 4px; border-radius: 14px; }
  .scale10 .chip {
    min-height: 3.3rem; padding: .6rem .2rem;
    font-size: 1.15rem; font-weight: 700; line-height: 1;
    background: var(--t); border: 0; border-radius: 14px;
    box-shadow: inset 0 -3px 0 var(--m);
    transition: background-color .15s ease, color .15s ease, transform .12s ease, box-shadow .15s ease;
  }
  .scale10 .chip.pre { background: var(--m); box-shadow: inset 0 -3px 0 var(--c); }
  .scale10 .chip.on {
    background: var(--c); color: var(--k);
    box-shadow: 0 10px 16px -10px var(--c), 0 0 0 3px var(--surface), 0 0 0 5px var(--c);
    transform: translateY(-2px);
  }
  /* Подписи краёв шкалы: слева про единицу, справа про десятку. */
  .scale-ends {
    display: flex; justify-content: space-between; gap: 1rem;
    font-weight: 400; font-size: .86rem; line-height: 1.35; color: var(--ink-mute);
  }
  .scale-ends span { flex: 0 1 auto; }
  .scale-ends span:last-child { text-align: right; }
  .chips { display: flex; flex-direction: column; gap: .5rem; }
  .chip {
    appearance: none; font: inherit; font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--ink); background: var(--surface-2);
    border: 2px solid transparent; border-radius: 14px;
    padding: .8rem .4rem; min-height: 3rem; cursor: pointer; text-align: center;
    transition: background-color .15s ease, border-color .15s ease;
  }
  .chips .chip { text-align: left; padding: .8rem .95rem; font-weight: 400; }
  /* Тариф в анкете: название, цена крупно, одна строка отличия. */
  .chips .chip.tarif { display: flex; flex-direction: column; gap: .25rem; padding: 1rem 1.05rem 1.05rem; }
  /* Название тарифа своим цветом не выделяем: красным в вопросах отмечено
     одно слово, а на выбранном синем варианте красный не читается. */
  .chips .chip.tarif b { font-size: 1.05rem; font-weight: 700; color: inherit; }
  .tarif-price { font-size: 1.45rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .tarif-price i { font-style: normal; font-size: .9rem; font-weight: 500; letter-spacing: 0; margin-left: .55rem; opacity: .85; }
  .tarif-text { font-size: .92rem; line-height: 1.4; opacity: .92; }
  /* Что даёт предзапись, над тарифами: персиковая плашка, как метки. */
  .perks-box { background: var(--accent-soft); border-radius: 18px; padding: 1rem 1.05rem 1.1rem; display: flex; flex-direction: column; gap: .8rem; }
  .perks-box p { font-weight: 700; line-height: 1.35; }
  .perks-box .checks { gap: .6rem; }
  .perks-box .checks li::before { background: #FFFFFF; }
  .perks-box .perk-sub { display: block; margin-top: .2rem; font-size: .88rem; font-weight: 400; line-height: 1.45; color: var(--ink-soft); }
  .chip:hover { border-color: var(--deep); }
  .chip.on { background: var(--deep); color: #FFFFFF; border-color: var(--deep); }

  .consents { display: flex; flex-direction: column; gap: .8rem; }
  .cb {
    display: grid; grid-template-columns: 24px 1fr; gap: .6rem; align-items: start;
    font-size: .92rem; line-height: 1.5; color: var(--ink-soft); cursor: pointer;
  }
  .cb input { width: 22px; height: 22px; margin: .1rem 0 0; accent-color: var(--deep); }
  .cb.err span { color: var(--warn); }
  .cb.err input { outline: 2px solid var(--warn); outline-offset: 2px; }
  .fine.err { color: var(--warn); font-weight: 700; font-size: .92rem; }

  /* — результат: сплошная страница, блоки отбиты воздухом — */
  .page { display: flex; flex-direction: column; }
  .sec { display: flex; flex-direction: column; gap: 1.1rem; padding: 1.9rem .2rem; }
  .sec:first-child { padding-top: .2rem; }
  .group { display: flex; flex-direction: column; gap: .7rem; }

  /* Тип человека — небо с афиши: синий градиент и круги радара поверх.
     Это главное цветовое пятно страницы. Тот же блок открывает тест
     на первом экране. Красной луны в углу нет (правка 03.10): красное
     здесь одно — плашка «Ваш тип». */
  .hero {
    position: relative; overflow: hidden;
    margin: 0 -.2rem;
    background:
      repeating-radial-gradient(circle at 100% 0%, rgba(255, 255, 255, .09) 0 1.5px, rgba(255, 255, 255, 0) 1.5px 30px),
      var(--sky);
    color: var(--hero-ink);
    border-radius: 24px;
    padding: 1.3rem 1.25rem 1.5rem;
    display: flex; flex-direction: column; gap: .9rem;
  }
  .hero .tag { background: var(--cta); color: var(--cta-ink); box-shadow: 0 6px 14px -8px rgba(0, 0, 0, .5); }
  .hero .lead { color: rgba(255, 255, 255, .94); }
  .card > .hero { margin: -.35rem -.2rem 0; }
  /* На 320 px «Сочувствующий» обязан помещаться в строку. */
  .type-name { font-size: clamp(1.75rem, 10.4vw, 2.6rem); line-height: 1.05; font-weight: 800; letter-spacing: -.03em; }

  /* Метка над важным. */
  .tag {
    display: inline-block; align-self: flex-start;
    background: var(--accent-soft); color: var(--accent-text);
    font-size: .86rem; font-weight: 700; line-height: 1.35;
    padding: .3rem .7rem; border-radius: 999px;
  }
  /* Длинная метка уходит в две строки, поэтому скругление у неё меньше. */
  .tag.deep { background: var(--deep); color: #FFFFFF; border-radius: 10px; }

  /* Ответ на вопрос заголовка: название сферы. */
  .answer { font-size: 1.7rem; line-height: 1.12; font-weight: 800; letter-spacing: -.025em; color: var(--deep); text-wrap: balance; }

  /* Сфера человека: небесная подложка. Та же — у его недели в программе. */
  .spot {
    background: linear-gradient(160deg, #EAF2FC 0%, #D9E7F9 100%);
    border-radius: 20px;
    padding: 1.15rem 1.15rem 1.2rem;
    display: flex; flex-direction: column; gap: .5rem;
  }

  /* Тёплая плашка: даты потока, слова техники. */
  /* «Вы сами отметили в тесте»: ответы человека лежат белой карточкой,
     как выписка из его же теста. */
  .mine { background: var(--surface); border-radius: 18px; padding: 1.1rem 1.15rem 1.2rem; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: .9rem; }
  .mine-h { font-weight: 700; color: var(--accent-text); }
  .panel { background: linear-gradient(160deg, #FFF3DE 0%, #FCDDC0 100%); border-radius: 18px; padding: 1.1rem 1.15rem; }
  .panel b { font-weight: 700; }
  .mantra { display: flex; flex-direction: column; gap: 1rem; line-height: 1.45; }
  .mantra b { display: block; font-weight: 800; font-size: 1.5rem; line-height: 1.15; letter-spacing: -.02em; margin-bottom: .25rem; color: var(--accent-text); }

  /* — что видно по ответам: пять делений и слово — */
  .gauges { display: flex; flex-direction: column; gap: 1.25rem; }
  .gauge-name { font-size: 1.04rem; line-height: 1.3; font-weight: 600; }
  /* Слово стоит в колонке одной ширины: деления у всех строк кончаются
     на одной вертикали, какой бы длины слово ни было. */
  .gauge-row { display: grid; grid-template-columns: 1fr 7.3rem; column-gap: .7rem; align-items: center; margin-top: .45rem; }
  .gauge-word { font-weight: 700; color: var(--accent-text); white-space: nowrap; text-align: right; }
  .gauge-ticks { display: flex; gap: 5px; }
  .gauge-ticks i {
    flex: 1; height: 10px; border-radius: 999px;
    background: var(--line-strong);
    transition: background-color .3s ease;
  }
  .gauge-ticks i.on { background: var(--accent); }
  .gauge-ticks i.on:nth-child(1) { background: #F0B13F; }
  .gauge-ticks i.on:nth-child(2) { background: #EC9039; }
  .gauge-ticks i.on:nth-child(3) { background: #E66B33; }
  .gauge-ticks i.on:nth-child(4) { background: #DD472F; }
  .gauge-ticks i.on:nth-child(5) { background: #D22B2B; }

  /* — суперспособности: три строки с галочкой — */
  .powers { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: .5rem; }
  .powers li {
    position: relative;
    background: var(--surface);
    border-radius: 16px;
    padding: .95rem 1rem .95rem 3.1rem;
    font-weight: 600; line-height: 1.35;
    box-shadow: var(--shadow);
  }
  .powers li::before {
    content: ""; position: absolute; left: .95rem; top: .95rem;
    width: 1.5rem; height: 1.5rem; border-radius: 50%; background: var(--accent);
  }
  .powers li::after {
    content: ""; position: absolute; left: 1.48rem; top: 1.25rem;
    width: .34rem; height: .66rem;
    border: solid var(--surface); border-width: 0 2.5px 2.5px 0;
    transform: rotate(45deg);
  }

  /* — шаги техники — */
  .steps { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 1.5rem; }
  .steps > li { display: grid; grid-template-columns: 2.2rem 1fr; column-gap: .75rem; row-gap: .8rem; align-items: start; }
  .step-n {
    width: 2.2rem; height: 2.2rem; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--deep); color: #FFFFFF;
    font-weight: 800; font-size: 1.1rem; line-height: 1;
  }
  .step-head { display: flex; flex-direction: column; gap: .25rem; min-width: 0; padding-top: .28rem; }
  .step-head h3 { font-size: 1.15rem; }
  .step-wide { grid-column: 1 / -1; }

  /* — медитация и эфир: посты канала, как в Телеграме —
     Аудио с дорожкой и видео с обложкой. Материал закрыт, поэтому
     на кнопке «играть» стоит замок, а нажатие по посту ведёт в анкету. */
  .posts { display: flex; flex-direction: column; gap: .7rem; }
  /* Три пары «вопрос → карточка». Вопрос человека стоит справа синим
     сообщением, как свои сообщения в Телеграме; карточка под ним — ответ
     Виолы. Вопрос набран крупнее текста карточки. */
  .lines span { display: block; }
  .qas { display: flex; flex-direction: column; gap: 1.5rem; }
  .qa { display: flex; flex-direction: column; gap: .6rem; }
  .ask {
    align-self: flex-end; max-width: 100%;
    background: var(--sky); color: #FFFFFF;
    font-size: 1.2rem; line-height: 1.25; font-weight: 700; letter-spacing: -.01em;
    padding: .7rem 1rem .75rem;
    border-radius: 18px 18px 6px 18px;
    box-shadow: 0 10px 18px -12px rgba(31, 76, 151, .8);
  }
  .post {
    appearance: none; display: block; width: 100%;
    font: inherit; color: inherit; text-align: left;
    background: var(--surface);
    border: 0; border-radius: 18px;
    padding: 0; overflow: hidden;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: transform .1s ease;
  }
  .post:active { transform: scale(.99); }
  .post-body { display: flex; flex-direction: column; gap: .3rem; padding: .8rem 1rem 1rem; }
  .post-title { font-weight: 700; line-height: 1.3; }
  .post-cap { color: var(--ink-soft); font-size: .97rem; line-height: 1.5; }

  /* Круглая кнопка «играть» с замком на краю. Синяя, как в Телеграме:
     красной на экране остаётся одна кнопка — анкета. */
  .play {
    position: relative; flex: none;
    width: 3.1rem; height: 3.1rem; border-radius: 50%;
    background: var(--sky); color: #FFFFFF;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 16px -8px rgba(31, 76, 151, .7);
  }
  .play > svg { width: 1.2rem; height: 1.2rem; margin-left: .15rem; }
  .play-lock {
    position: absolute; right: -.3rem; bottom: -.3rem;
    width: 1.45rem; height: 1.45rem; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface); color: var(--accent-text);
    box-shadow: 0 0 0 1px var(--line), 0 2px 5px rgba(24, 33, 58, .2);
  }
  .play-lock svg { width: .8rem; height: .8rem; }

  /* Аудио: кнопка, название, чьё оно, дорожка и длительность. */
  .audio { display: grid; grid-template-columns: 3.1rem 1fr; column-gap: .9rem; align-items: start; padding: 1rem 1rem .1rem; }
  .audio-main { display: flex; flex-direction: column; gap: .12rem; min-width: 0; }
  .audio-title { font-weight: 700; line-height: 1.25; }
  .audio-by { font-size: .9rem; font-weight: 600; color: var(--deep); line-height: 1.3; }
  .audio-row { display: flex; align-items: center; gap: .6rem; margin-top: .35rem; }
  .wave { display: flex; align-items: center; gap: 2px; height: 1.5rem; flex: 1; min-width: 0; overflow: hidden; }
  .wave i { flex: none; width: 3px; border-radius: 2px; background: var(--deep); opacity: .45; }
  .audio-time { flex: none; font-size: .86rem; font-weight: 600; color: var(--ink-mute); white-space: nowrap; }

  /* Видео: обложка 16:9, кнопка и пометка «запись» по нижним углам. */
  .video { position: relative; display: block; aspect-ratio: 16 / 9; background: #143A85; }
  .video img { display: block; width: 100%; height: 100%; object-fit: cover; }
  /* Кнопка в углу, а не по центру: по центру она закрывала бы лицо в кадре. */
  .video .play {
    position: absolute; left: .7rem; bottom: .7rem;
    width: 2.9rem; height: 2.9rem;
    background: rgba(16, 24, 48, .74); box-shadow: none;
  }
  .video .play > svg { width: 1.05rem; height: 1.05rem; }
  .video-time {
    position: absolute; right: .6rem; bottom: .7rem;
    background: rgba(16, 24, 48, .74); color: #FFFFFF;
    font-size: .86rem; font-weight: 600; line-height: 1.3;
    padding: .18rem .6rem; border-radius: 999px;
  }
  /* Третья карточка, про цену: тот же пост, вместо плеера знак процента
     на золотом круге, замок на краю. Знак ровный и симметричный: ценник
     под углом в маленьком круге смотрелся криво. */
  .perk { display: grid; grid-template-columns: 3.1rem 1fr; column-gap: .9rem; align-items: start; padding: 1rem; }
  .perk-main { display: flex; flex-direction: column; gap: .3rem; min-width: 0; }
  .perk-title { font-weight: 700; line-height: 1.25; }
  .play.gold {
    background: linear-gradient(135deg, #F7CB62 0%, #EFA533 100%); color: #143A85;
    box-shadow: 0 8px 16px -8px rgba(214, 140, 30, .85);
  }
  .play.gold > svg { width: 1.4rem; height: 1.4rem; margin-left: 0; }

  /* Метка над кнопкой стоит по центру, как и сама кнопка. На обычном телефоне
     она в строку не помещается, поэтому переносится после слова «Предзапись»
     и остаётся плашкой по ширине текста. На широком экране перенос выключен. */
  .foot > .tag { align-self: center; text-align: center; }
  .foot > .tag br { display: none; }
  @media (max-width: 410px) {
    .foot > .tag { border-radius: 14px; padding: .4rem .9rem; }
    .foot > .tag br { display: inline; }
  }

  /* — программа по неделям — */
  .weeks { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: .35rem; }
  .weeks li {
    display: grid; grid-template-columns: 2rem 1fr; column-gap: .75rem; align-items: start;
    padding: .7rem .2rem;
  }
  .week-n {
    width: 2rem; height: 2rem; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface-2); color: var(--ink-soft);
    font-weight: 700; font-size: .95rem; line-height: 1;
  }
  .week-t { font-weight: 700; line-height: 1.3; padding-top: .2rem; }
  .week-q { margin-top: .2rem; color: var(--ink-soft); font-size: .95rem; line-height: 1.45; }
  /* Недели идут в порядке программы. Неделя под сферу человека выделена
     на своём месте — той же сиреневой подложкой, что и сама сфера. */
  .weeks li.mine { background: linear-gradient(160deg, #EAF2FC 0%, #D9E7F9 100%); border-radius: 20px; padding: 1rem 1rem 1.1rem; margin: .3rem -.2rem; }
  .weeks li.mine .week-n { background: var(--deep); color: #FFFFFF; }
  .weeks li.mine .week-q { color: var(--ink); }
  .weeks li .tag { grid-column: 1 / -1; justify-self: start; margin-bottom: .75rem; }

  /* Вторая кнопка анкеты, после программы: блок неба, как у названия типа. */
  .offer-card {
    background: var(--sky);
    color: #FFFFFF;
    border-radius: 24px;
    padding: 1.4rem 1.2rem 1.3rem;
    display: flex; flex-direction: column; gap: 1rem;
  }
  .offer-card .fine { color: rgba(255, 255, 255, .9); }
  .offer-card h3 { font-size: 1.3rem; line-height: 1.25; letter-spacing: -.015em; }
  /* Итог: три пункта на тёмных плитках, значок на золотом круге. Плитка
     темнее неба, поэтому белый текст на ней читается лучше, чем на фоне. */
  .total { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: .5rem; }
  .total li {
    display: grid; grid-template-columns: 2.6rem 1fr; column-gap: .85rem; align-items: center;
    background: rgba(9, 26, 68, .34); border-radius: 16px; padding: .8rem .9rem;
  }
  .total-ic {
    width: 2.6rem; height: 2.6rem; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #F7CB62 0%, #EFA533 100%); color: #143A85;
  }
  .total-ic svg { width: 1.3rem; height: 1.3rem; }
  .total-main { display: flex; flex-direction: column; gap: .1rem; min-width: 0; }
  .total-main b { font-weight: 700; line-height: 1.25; }
  .total-main span { font-size: .92rem; line-height: 1.35; color: rgba(255, 255, 255, .88); }

  .reviews { display: flex; flex-direction: column; gap: .7rem; }
  .review { background: var(--surface); border-radius: 18px; padding: 1.05rem 1.1rem; box-shadow: var(--shadow); }
  .review small { display: block; margin-top: .45rem; color: var(--ink-mute); font-size: .86rem; }

  /* Вопросы: список в одной карточке, как настройки в телефоне. */
  .faq { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
  .faq details { padding: .95rem 1rem; border-top: 1px solid var(--line); }
  .faq details:first-child { border-top: 0; }
  .faq summary {
    cursor: pointer; list-style: none; position: relative; padding-right: 1.8rem;
    font-weight: 600; line-height: 1.35;
  }
  .faq summary::-webkit-details-marker { display: none; }
  .faq summary::after {
    content: ""; position: absolute; right: .3rem; top: .32em;
    width: .5rem; height: .5rem;
    border: solid var(--ink-mute); border-width: 0 2.5px 2.5px 0;
    transform: rotate(45deg);
    transition: transform .2s ease;
  }
  .faq details[open] summary::after { transform: rotate(-135deg); top: .55em; }
  .faq details p { margin-top: .6rem; color: var(--ink-soft); }

/* ——— подсчёт ——— */
function inv(v) { return 3 - v; }

/* Самая просевшая сфера. Сумма двух ответов, от 0 до 6. Меньше трёх у лучшей
   из сфер — значит, не проседает ничего, и сферу не называем: выдуманный
   результат хуже, чем его отсутствие. */
function pickSphere(v, type) {
  const sums = {}, strong = {};
  SPHERES.forEach(s => { sums[s.k] = 0; strong[s.k] = 0; });
  SQ.forEach((q, i) => {
    const a = v[Q.length + i] || 0;
    sums[q.sf] += a;
    if (a === 3) strong[q.sf]++;
  });
  const keys = SPHERES.map(s => s.k);
  const max = Math.max.apply(null, keys.map(k => sums[k]));
  if (max < 3) return { key: "", sums: sums };
  let tied = keys.filter(k => sums[k] === max);
  if (tied.length > 1) {
    const named = BOL_TO_SPHERE[forks.bol];
    if (named && tied.indexOf(named) !== -1) tied = [named];
  }
  if (tied.length > 1) {
    const top = Math.max.apply(null, tied.map(k => strong[k]));
    tied = tied.filter(k => strong[k] === top);
  }
  if (tied.length > 1 && tied.indexOf(TYPE_SPHERE[type]) !== -1) tied = [TYPE_SPHERE[type]];
  return { key: tied[0], sums: sums };
}

function score() {
  const v = answers;
  const A = v[0] + v[1] + v[2];
  const P = inv(v[3]) + inv(v[5]) + inv(v[6]);
  const I = v[7] + v[8] + v[9];
  const B = v[10] + v[11] + v[12];
  const C = v[13] + v[14] + v[15] + v[16];
  const G = inv(v[18]) + v[19];
  const L = v[20] + v[21];
  const F = v[22] + v[23];
  const K = (v[4] === 3 ? 1 : 0) + (v[17] === 3 ? 1 : 0);

  const dar = A / 9;
  const prox = Math.max(P, I) / 9;
  const price = Math.max(B / 9, C / 12, I / 9);
  let pct = Math.round(dar * 40 + prox * 30 + price * 30);
  if (K === 2) pct -= 10;
  pct = Math.max(20, Math.min(97, pct));

  /* Условия и их порядок перенесены из первого теста без изменений: тип там
     и здесь обязан получаться один и тот же. Почему порядок именно такой —
     в miniapps/test/index.html. */
  let key;
  if (F >= 5 && L <= 1 && A <= 5) key = "other";
  else if (A <= 3 && C <= 4) key = "caring";
  else if (A >= 6 && P <= 3 && I <= 4 && B <= 3) key = "reader";
  else if (I >= 6 && (I - C) >= 1 && G <= 4 && K < 2) key = "awake";
  else {
    const b = B / 9, c = C / 12, g = G / 6;
    key = (c >= b && c >= g) ? "donor" : (b >= g ? "filter" : "sleeping");
  }

  const empath = EMPATH.indexOf(key) !== -1;
  const sp = pickSphere(v, key);
  return { key, pct, fon: empath && F >= 4, scales: { A, P, I, B, C, G, L, F, K },
           sphere: sp.key, spheres: sp.sums };
}

/* Какие утверждения показать в блоке «Почему пользуются именно вами?»:
   ответы «да» и «часто» из списка RYADOM.pick, сначала с 3 баллами, внутри
   одного балла в порядке списка, не больше max. Если набралось меньше min,
   список пустой и блока нет. */
function ryadomList() {
  const hit = RYADOM.pick.filter(x => answers[x.i] >= 2);
  const list = hit.filter(x => answers[x.i] === 3).concat(hit.filter(x => answers[x.i] === 2)).slice(0, RYADOM.max);
  return list.length >= RYADOM.min ? list : [];
}
/* Утверждение теста для списка: дословно, с маленькой буквы и без точки. */

/* Ближайший поток: первое число следующего месяца по Москве. */
const MONTHS = ["января", "февраля", "марта", "апреля", "мая", "июня",
                "июля", "августа", "сентября", "октября", "ноября", "декабря"];
function stream() {
  const msk = new Date(Date.now() + 3 * 3600e3);   // Москва, UTC+3 круглый год
  const y = msk.getUTCFullYear(), m = msk.getUTCMonth();
  const start = new Date(Date.UTC(y, m + 1, 1));
  const close = new Date(Date.UTC(y, m + 1, 0));
  return {
    start: "1 " + MONTHS[start.getUTCMonth()],
    close: close.getUTCDate() + " " + MONTHS[close.getUTCMonth()]
  };
}

/* Неразрывные пробелы: тире не начинает строку, а предлог, союз или число
   не остаётся в её конце. На узком экране без этого каждая третья строка
   кончалась на «и», «в» или «не». Поля ввода не трогаем. */
const SHORT_WORD = /(^|[\s«(\u00A0])([А-Яа-яЁё]{1,2}|\d+)[ \t\n]+(?=\S)/g;
function typograf_(root) {
  if (!document.createTreeWalker) return;
  const walker = document.createTreeWalker(root, 4 /* NodeFilter.SHOW_TEXT */, null);
  let node;
  while ((node = walker.nextNode())) {
    const tag = node.parentNode && node.parentNode.nodeName;
    if (tag === "TEXTAREA" || tag === "SCRIPT" || tag === "STYLE") continue;
    let t = node.nodeValue, was;
    if (!/\S/.test(t)) continue;
    t = t.replace(/ — /g, "\u00A0— ");
    t = t.replace(/ (\d[\d.,]*)(?=[.,!?»)]*(\s|$))/g, "\u00A0$1");
    do { was = t; t = t.replace(SHORT_WORD, "$1$2\u00A0"); } while (t !== was);
    if (t !== node.nodeValue) node.nodeValue = t;
  }
}

/* Имя из Телеграма и свои слова подставляются в разметку. Кавычка в имени
   рвала атрибут value и оставляла поле пустым — а такие имена встречаются. */
const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ESC[c]);
}
function lower1(s) { s = String(s || ""); return s.charAt(0).toLowerCase() + s.slice(1); }

/* Правовые страницы открываем средствами Телеграма: обычный target=_blank
   внутри мини-аппа на части клиентов просто не срабатывает. Ссылки на t.me
   не трогаем: их уводит openTelegramLink, и у них свои обработчики. */
function linksThroughTelegram_(node) {
  node.querySelectorAll("a").forEach(a => a.addEventListener("click", (e) => {
    const href = a.getAttribute("href");
    if (!href || href.indexOf("http") !== 0) return;
    if (href.indexOf("https://t.me/") === 0) return;
    const tg = tgApp();
    if (inTg_() && tg.openLink) { e.preventDefault(); tg.openLink(href); }
  }));
}

   в бот. Не записалось — запись остаётся в очереди viola2-pending, а на
   экране предлагаем повторить. */
const BOT_URL = "https://t.me/viola_maro_bot?start=t2_done";

function result(prev) {
  const r = prev || score();
  lastResult = r;
  stage = "ready";
  saveState();
  if (prev) {
    /* Результат с этого устройства уже отправлялся. Если он так и лежит
       в очереди, досылаем его до кнопки. */
    if (pendingResult_()) { saving_(pendingResult_()); return; }
    recheck_(r);
    return;
  }
  saving_(resultPayload_(r));
}

/* Телефон помнит «тест пройден», а бот смотрит в таблицу. Строку могли
   удалить, или прохождение ушло без ID в Телеграме. Тогда тест говорил
   «результат готов», бот отвечал «тест ещё не закончен», и человек ходил
   по кругу (19.10). Поэтому перед кнопкой спрашиваем таблицу тем же
   запросом статуса, что у бота. Не видит или не ответила — досылаем
   прохождение из сохранённых ответов, уже под ID этого человека.
   Без ID проверять нечем — как раньше, сразу экран «готово». */
function recheck_(r) {
  if (!CONFIG.sheetUrl || !inTg_() || !tgUser().id) { readyScreen(); return; }
  render(el(`<div class="card"><p class="soft center">Открываю…</p></div>`));
  status_().then(st => {
    if (st && String(st.passed) === "1") { readyScreen(); return; }
    const p = resultPayload_(r);
    p.seconds = 0;               // время с первого прохождения — не время теста
    p.fast = false;
    if (src0) p.istochnik = src0;
    saving_(p);
  });
}

/* Запись прохождения, которая ещё не подтверждена приёмником. */
function pendingResult_() {
  try {
    const all = JSON.parse(localStorage.getItem(BUFFER_KEY) || "[]");
    return all.filter(x => x.type === "t2_result" && x.pid === pid)[0] || null;
  } catch (e) { return null; }
}

function saving_(p) {
  render(el(`<div class="card"><p class="soft center">Сохраняю ваш результат…</p></div>`));
  saveResult_(p).then(ok => {
    if (ok) { readyScreen(); return; }
    const n = el(`
      <div class="card">
        <h2>Не получилось сохранить результат</h2>
        <p class="lead">Проверьте интернет и нажмите кнопку ещё раз.</p>
        <div class="foot"><button class="go" id="retry">Сохранить ещё раз</button></div>
      </div>`);
    n.querySelector("#retry").addEventListener("click", () => saving_(p));
    render(n);
  });
}

/* Шлём прохождение и ждём {"ok":true}. До подтверждения запись лежит
   в очереди: закроют приложение — уйдёт при следующем открытии. */
function saveResult_(p) {
  if (!CONFIG.sheetUrl) return Promise.resolve(true);
  buffer(p);
  let tries = 0;
  return new Promise(resolve => {
    const attempt = () => {
      tries++;
      const slow = new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 9000));
      Promise.race([send_(p).then(res => res.text()), slow])
        .then(txt => {
          if (!/"ok"\s*:\s*true/.test(String(txt))) throw new Error("not ok");
          unbuffer(p);
          resolve(true);
        })
        .catch(() => { if (tries < 3) setTimeout(attempt, 1500); else resolve(false); });
    };
    attempt();
  });
}

function readyScreen() {
  stage = "ready";
  saveState();
  const n = el(`
    <div class="card">
      <h2>Ваш результат готов ✨</h2>
      <p class="lead">Я уже отправила его вам в бот, возвращайтесь, там всё ждёт</p>
      <div class="foot">
        <a class="go" id="to-bot" href="${BOT_URL}" target="_blank" rel="noopener">Получить результат в боте</a>
      </div>
    </div>`);
  n.querySelector("#to-bot").addEventListener("click", (e) => {
    const tg = tgApp();
    if (inTg_() && tg.openTelegramLink) {
      e.preventDefault();
      try { tg.openTelegramLink(BOT_URL); } catch (err) { window.location.href = BOT_URL; return; }
      /* Новые клиенты Телеграма после перехода оставляют приложение открытым —
         закрываем сами. Старые закрывают его при переходе. */
      setTimeout(() => { try { tg.close(); } catch (err) {} }, 300);
    }
  });
  render(n);
}

/* ——— откуда человек пришёл ———
   В Телеграме метка приходит в start_param: ?startapp=src_reels даёт «reels».
   Ссылка из напоминания бота, startapp=anketa_d1, открывает экран программы,
   и сама метка идёт в «Источник» целиком: видно, какое напоминание сработало.
   В обычном браузере метка берётся из ?src=…, так приходят по пересылке. */
function startParam_() {
  const tg = tgApp();
  let p = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || "";
  if (!p) { try { p = new URLSearchParams(location.search).get("startapp") || ""; } catch (e) {} }
  return String(p);
}
function istochnik_() {
  const p = startParam_();
  let s = "";
  if (p.indexOf("src_") === 0) s = p.slice(4);
  else if (p.indexOf("anketa") === 0 || p === "zayavka" || p === "rezultat" || p === "programma" || p === "reset") s = p;
  else { try { s = new URLSearchParams(location.search).get("src") || ""; } catch (e) {} }
  return String(s).replace(/[^\w\-]/g, "").slice(0, 40);
}

/* ——— тест открыли не в Телеграме (правка 19.10) ———
   Результат приходит только в бот, а бот находит человека по ID в Телеграме.
   В обычном браузере ID нет: прохождение ложилось в таблицу без него, бот
   отвечал «тест ещё не закончен», и тест приходилось проходить второй раз.
   Поэтому в браузере вместо вопросов одна кнопка: открыть тест в Телеграме
   с той же меткой источника. Локальный просмотр (localhost, файл) — как раньше. */
const APP_URL = "https://t.me/viola_maro_bot/test2";

function plainBrowser_() {
  try {
    if (inTg_()) return false;
    if (location.protocol === "file:" || /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) return false;
    /* Скрипт Телеграма мог не успеть загрузиться. Внутри Телеграма адрес всё
       равно несёт tgWebApp…, а в приложениях есть свой мост. Хоть один признак —
       считаем, что это Телеграм, и не мешаем. */
    if (/tgWebApp/.test(String(location.hash) + String(location.search))) return false;
    if (window.TelegramWebviewProxy) return false;
    if (window.parent && window.parent !== window) return false;   // web.telegram.org держит приложение во фрейме
    if (sessionStorage.getItem("__telegram__initParams")) return false;
    return true;
  } catch (e) { return false; }
}

function appLink_() {
  let p = startParam_();
  if (!p) { const s = istochnik_(); if (s) p = "src_" + s; }
  p = String(p).replace(/[^\w\-]/g, "").slice(0, 64);
  return APP_URL + (p ? "?startapp=" + p : "");
}

function browserScreen_() {
  stage = "browser";
  render(el(`
    <div class="card">
      <h2>Тест открывается в Telegram</h2>
      <p class="lead">Результат я пришлю вам в бот, поэтому проходить тест нужно в Telegram. Нажмите кнопку, и тест откроется там 👇</p>
      <div class="foot">
        <a class="go" id="to-app" href="${esc(appLink_())}" rel="noopener">Открыть в Telegram</a>
      </div>
    </div>`));
}

/* ——— отправка в таблицу ———
   Все записи теста 2.0 идут с test: "empat2" и form: "test2". Вторая метка —
   страховка: приёмник старой версии, который теста 2.0 ещё не знает, запись
   с неизвестной формой честно отклоняет, а не кладёт её в лист первого теста. */
const BUFFER_KEY = "viola2-pending";

function base_(type) {
  const u = tgUser();
  return {
    type: type, form: "test2", test: "empat2", pid: pid,
    userId: u.id || "",
    userLogin: u.username ? "@" + u.username : "",
    userName: [u.first_name, u.last_name].filter(Boolean).join(" "),
    istochnik: istochnik_()
  };
}

/* Пинг «открыл первый вопрос». Бот по нему отличает «не открывал тест»
   от «начал и бросил». Один раз за жизнь страницы и мимо буфера:
   потеряется — не страшно, это не лид. */
let pinged = false;
function pingStart_() {
  if (pinged || !CONFIG.sheetUrl) return;
  pinged = true;
  const u = tgUser();
  try {
    send_({ type: "start", test: "empat2", pid: pid, userId: u.id || "", istochnik: istochnik_() }).catch(() => {});
  } catch (e) {}
}

/* Данные уходят обычным GET с параметром: POST на веб-приложение Apps Script
   у анонимных запросов упирается в редирект и не доходит. Проверено на первом тесте. */
function send_(payload) {
  return fetch(CONFIG.sheetUrl + "?payload=" + encodeURIComponent(JSON.stringify(payload)), {
    keepalive: true
  });
}

/* Кладём в буфер и пробуем отправить. Не дошло — полежит и уйдёт
   при следующем открытии страницы. Иначе обрыв связи = потерянный лид. */
function queue(item) {
  buffer(item);
  flush();
}

function event_(name, block) {
  if (!CONFIG.sheetUrl || !pid) return;
  const e = base_("t2_event");
  e.event = name;
  e.block = block || "";
  e.t = Date.now();
  queue(e);
}

function resultPayload_(r) {
  const seconds = startedAt ? Math.round((Date.now() - startedAt) / 1000) : 0;
  const same = answers.length && answers.every(x => x === answers[0]);
  const p = base_("t2_result");
  p.seconds = seconds;
  p.fast = seconds > 0 && seconds < 40;   // 36 утверждений быстрее 40 секунд — читать человек не успевал
  p.monotone = same;                      // одна и та же кнопка на всё
  p.rank = r.key;
  p.percent = r.pct;
  p.scales = r.scales;
  p.sphere = r.sphere;
  p.spheres = r.spheres;
  p.age = age;
  p.words = words;
  p.forks = forks;
  p.answers = answers.slice();
  /* Блок «Почему пользуются именно вами?»: сколько утверждений человек
     увидел и какие (короткие имена из RYADOM.pick). Блока нет — ноль. */
  const shown = EMPATH.indexOf(r.key) !== -1 && CONFIG.blocks.ryadom ? ryadomList() : [];
  p.ryadom_n = shown.length;
  p.ryadom_list = shown.map(x => x.key).join(", ");
  window.__result = p;
  return p;
}

function buffer(item) {
  try {
    const all = JSON.parse(localStorage.getItem(BUFFER_KEY) || "[]");
    all.push(item);
    localStorage.setItem(BUFFER_KEY, JSON.stringify(all));
  } catch (e) {}
}

/* Вынимаем из буфера ровно одну запись — ту, что подтвердил приёмник. */
function unbuffer(item) {
  try {
    const s = JSON.stringify(item);
    const all = JSON.parse(localStorage.getItem(BUFFER_KEY) || "[]");
    const i = all.findIndex(x => JSON.stringify(x) === s);
    if (i !== -1) {
      all.splice(i, 1);
      localStorage.setItem(BUFFER_KEY, JSON.stringify(all));
    }
  } catch (e) {}
}

const inFlight = new Set();

/* Буфер чистим ТОЛЬКО после подтверждения от приёмника: дубль в таблице
   пережить можно, потерю контакта — нет. Отметки о прокрутке — не контакт:
   если приёмник их отклонил, второй раз не шлём, чтобы буфер не рос. */
function flush() {
  if (!CONFIG.sheetUrl) return;
  let all = [];
  try { all = JSON.parse(localStorage.getItem(BUFFER_KEY) || "[]"); } catch (e) { return; }
  if (!all.length) return;
  /* Обёртка не про сеть, а про сам вызов: fetch есть не в каждом вебвью. */
  try {
    all.forEach(item => {
      const key = JSON.stringify(item);
      if (inFlight.has(key)) return;     // тот же элемент уже летит — второй раз не шлём
      inFlight.add(key);
      send_(item)
        .then(res => res.text())
        .then(txt => {
          /* Приёмник отвечает {"ok":true}. Страница входа Google или отказ
             значат, что запись НЕ сохранилась: оставляем её до следующего раза. */
          if (txt.indexOf('"ok":true') !== -1 || item.type === "t2_event") unbuffer(item);
        })
        .catch(() => {})
        .then(() => { inFlight.delete(key); });
    });
  } catch (e) {}
}

/* ——— сохранение прогресса ———
   Мини-апп внутри Телеграма может перезагрузиться сам: свернули и вернулись,
   система выгрузила вкладку. Держим ответы в памяти браузера и возвращаем
   человека на то же место. */
const STATE_KEY = "viola2-state";
const TTL_MID = 24 * 3600e3;        // недопройденный тест живёт сутки
/* Готовый результат — 35 дней: бот напоминает про анкету через день, через три
   и в последние три дня месяца. Кнопка из напоминания должна привести человека
   к его результату, а не в начало теста. */
const TTL_DONE = 35 * 24 * 3600e3;

function saveState() {
  try {
    localStorage.setItem(STATE_KEY, JSON.stringify({
      v: 2, t: Date.now(), stage: stage, idx: idx,
      answers: answers.slice(), forks: forks, words: words, age: age,
      startedAt: startedAt, res: lastResult, pid: pid, src: src0,
      form: form, formStep: formStep, leadSent: leadSent
    }));
  } catch (e) {}
}

function clearState() {
  /* Контакт и отметку об анкете оставляем: тот, кто проходит тест заново,
     уже в предзаписи, и второй раз анкету ему заполнять не нужно. */
  try {
    if (leadSent || form.name || form.contact) {
      localStorage.setItem(STATE_KEY, JSON.stringify({
        v: 2, t: Date.now(), stage: "intro", idx: 0, answers: [], forks: {},
        form: form, formStep: 0, leadSent: leadSent
      }));
    } else {
      localStorage.removeItem(STATE_KEY);
    }
  } catch (e) {}
}

/* Шкалы, без которых экран результата не построить. */
const SCALES_NEEDED = ["A", "P", "I", "B", "C", "G", "L"];

/* Сохранённое прохождение могло остаться от прежней версии теста. Не сошлось —
   молча начинаем заново: потерять полтора экрана ответов не так дорого,
   как сутки видеть экран «тест не открылся». */
function stateOk_(s) {
  if (s.v !== 2) return false;
  const a = s.answers;
  if (!Array.isArray(a) || a.length > ALL.length) return false;
  if (!a.every(v => typeof v === "number" && v >= 0 && v <= 3)) return false;
  if (s.res) {
    if (!RESULTS[s.res.key]) return false;
    const sc = s.res.scales;
    if (!sc || typeof sc !== "object") return false;
    if (!SCALES_NEEDED.every(k => typeof sc[k] === "number")) return false;
    if (s.res.sphere && !SPHERE[s.res.sphere]) return false;
  }
  if (s.form && typeof s.form !== "object") return false;
  return true;
}

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STATE_KEY) || "null");
    if (!s || !s.t) return null;
    const finished = (s.answers || []).length === ALL.length || s.leadSent;
    if (Date.now() - s.t > (finished ? TTL_DONE : TTL_MID)) { localStorage.removeItem(STATE_KEY); return null; }
    if (!stateOk_(s)) { localStorage.removeItem(STATE_KEY); return null; }
    return s;
  } catch (e) { return null; }
}

function boot() {
  const tg = tgApp();
  if (tg) {
    tg.ready();
    tg.expand();
    /* Экран результата длинный. Пока листаешь его вниз, Телеграм может принять
       прокрутку за жест «свернуть» и утащить приложение. Bot API 7.7+ */
    if (tg.disableVerticalSwipes) { try { tg.disableVerticalSwipes(); } catch (e) {} }
  }

  syncTheme_();
  if (tg && tg.onEvent) { try { tg.onEvent("themeChanged", syncTheme_); } catch (e) {} }
  const ava = document.getElementById("brand-ava");
  if (ava) ava.src = IMG.avatar;

  const sp = startParam_();

  /* Обычный браузер: проходить тест здесь бесполезно, результат до бота
     не дойдёт. Неотправленное с прошлых раз всё же досылаем. */
  if (plainBrowser_()) { flush(); browserScreen_(); return; }

  /* Сброс для проверок команды (правка 19.10). Ссылка t2_reset в боте снимает
     с человека метки и присылает кнопку с startapp=reset: тест забывает
     прохождение на этом устройстве и начинается с первого экрана.
     Обычным людям эта кнопка не приходит. */
  if (sp === "reset") {
    try { localStorage.removeItem(STATE_KEY); localStorage.removeItem(BUFFER_KEY); } catch (e) {}
    intro();
    return;
  }

  flush();   // всё, что не ушло в прошлый раз, отправляем при каждом открытии

  /* Прежние кнопки бота «Мой результат» и «Посмотреть программу»
     (startapp=rezultat, programma, zayavka, anketa_*) ведут на экран
     «Ваш результат готов», а если теста ещё не было — к его началу. */
  const fromBot = sp === "rezultat" || sp === "programma" || sp === "zayavka" || sp.indexOf("anketa") === 0;
  const s = loadState();

  if (s) {
    (s.answers || []).forEach(v => answers.push(v));
    Object.keys(s.forks || {}).forEach(k => { forks[k] = s.forks[k]; });
    words = s.words || "";
    age = s.age || "";
    startedAt = s.startedAt || 0;
    pid = s.pid || "";
    src0 = typeof s.src === "string" ? s.src : "";
    lastResult = s.res || null;
  }
  const finished = !!lastResult || (answers.length === ALL.length && !!age);

  if (fromBot) {
    if (finished) { result(lastResult); return; }
    entry_();
    return;
  }

  if (!s) { intro(); return; }

  if (answers.length === ALL.length) {
    if (s.stage === "fork") { idx = Math.min(s.idx || 0, FORKS.length - 1); fork(); return; }
    if (s.stage === "words") { wordsScreen(); return; }
    if (s.stage === "age") { ageScreen(); return; }
    /* Аргумент обязателен: без него result() отправит прохождение в таблицу второй раз.
       Вердикта нет только у того, кто закрыл тест на вопросе про возраст. */
    if (lastResult) { result(lastResult); return; }
    if (age) { result(); return; }
    idx = 0; fork();
    return;
  }
  if (s.stage === "q" && answers.length) { idx = Math.min(s.idx || 0, answers.length, ALL.length - 1); question(); return; }

  answers.length = 0;
  intro();
}

/* ——— вход по кнопке бота без результата на этом устройстве ———
   Тест мог быть пройден на другом устройстве: спрашиваем таблицу тем же
   запросом статуса, что у бота. Пройден — экран «Ваш результат готов»,
   нет — начало теста. */
function status_() {
  const u = tgUser();
  if (!CONFIG.sheetUrl || !u.id) return Promise.resolve(null);
  const url = CONFIG.sheetUrl + "?action=status&test=empat2&tg=" + encodeURIComponent(u.id) +
              (u.username ? "&login=" + encodeURIComponent(u.username) : "");
  const req = fetch(url).then(r => r.json()).catch(() => null);
  const slow = new Promise(res => setTimeout(() => res(null), 6000));
  return Promise.race([req, slow]);
}

function entry_() {
  render(el(`<div class="card"><p class="soft center">Открываю…</p></div>`));
  status_().then(st => {
    if (st && String(st.passed) === "1") { readyScreen(); return; }
    intro();
  });
}

/* ——— картинки ———
   Вшиты в файл: внешних запросов у теста нет. avatar — из портрета с сайта
   (source/assets/viola-hero.png), efir — кадр из записи эфира, foto — фото
