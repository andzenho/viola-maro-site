<script>
/* Страховка. Если основной скрипт упадёт на старом браузере, человек увидит
   объяснение, а не белый экран. Здесь намеренно только ES5. Сохранённые
   ответы при этом не трогаем: в них четверть часа чужой работы. */
(function () {
  var shown = false;
  function fallback(msg) {
    if (shown) return;
    shown = true;
    var box = document.getElementById("screen") || document.body;
    if (!box) return;
    box.innerHTML =
      '<div style="max-width:32rem;margin:1.5rem auto;padding:1.4rem;font:18px/1.55 system-ui,-apple-system,sans-serif;' +
      'color:#18213A;background:#fff;border-radius:18px">' +
      '<p style="margin:0 0 .9rem;font-size:1.3rem;font-weight:700">Анкета не открылась с первого раза</p>' +
      '<p style="margin:0 0 .9rem">Так бывает: оборвалась связь или страница не догрузилась. ' +
      'Нажмите «Открыть заново». Ответы, которые вы уже дали, сохранены.</p>' +
      '<p style="margin:0 0 .9rem"><button onclick="location.reload()" ' +
      'style="font:inherit;font-weight:700;padding:.9rem 1.2rem;color:#fff;background:#B3161F;border:0;border-radius:14px">' +
      'Открыть заново</button></p>' +
      '<p style="margin:0;font-size:.9rem;color:#5F687E">Не помогло, напишите в службу заботы @violamaroteam и пришлите эту строку: ' +
      String(msg).replace(/</g, "&lt;").slice(0, 200) + '</p></div>';
  }
  window.__fallback = fallback;
  window.addEventListener("error", function (e) {
    fallback(e && e.message ? e.message : "неизвестная ошибка");
  });
  setTimeout(function () {
    var s = document.getElementById("screen");
    if (s && !s.firstChild) fallback("пустой экран");
  }, 7000);
})();
</script>

   продолжил с того же шага. Хранится 30 дней. */

function saveState() {
  try {
    localStorage.setItem(STATE_KEY, JSON.stringify({
      v: 1, t: Date.now(), stage: stage, step: step,
      a: A, other: OTHER, nick: nick, tgId: tgId, pd: acceptPd, sent: sent
    }));
  } catch (e) {}
}
function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STATE_KEY) || "null");
    if (!s || s.v !== 1 || !s.t || Date.now() - s.t > TTL) return null;
    return s;
  } catch (e) { return null; }
}

/* ——— мелочи ——— */
const view = document.getElementById("screen");
const topEl = document.getElementById("top");
const counter = document.getElementById("counter");
const barFill = document.getElementById("bar-fill");

const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ESC[c]); }

/* Неразрывные пробелы: тире не начинает строку, а предлог, союз или число
   не остаётся в её конце. Поля ввода не трогаем. Тот же приём, что в тесте. */
const SHORT_WORD = /(^|[\s«( ])([А-Яа-яЁё]{1,2}|\d+)[ \t\n]+(?=\S)/g;
function typograf_(root) {
  if (!document.createTreeWalker) return;
  const walker = document.createTreeWalker(root, 4, null);
  let node;
  while ((node = walker.nextNode())) {
    const tag = node.parentNode && node.parentNode.nodeName;
    if (tag === "TEXTAREA" || tag === "SCRIPT" || tag === "STYLE") continue;
    let t = node.nodeValue, was;
    if (!/\S/.test(t)) continue;
    t = t.replace(/ — /g, " — ");
    t = t.replace(/ (\d[\d.,]*)(?=[.,!?»)]*(\s|$))/g, " $1");
    do { was = t; t = t.replace(SHORT_WORD, "$1$2 "); } while (t !== was);
    if (t !== node.nodeValue) node.nodeValue = t;
  }
}
function el(html) {
  const d = document.createElement("div");
  d.className = "fade";
  d.innerHTML = html;
  typograf_(d);
  return d;
}
function render(node) {
  while (view.firstChild) view.removeChild(view.firstChild);
  linksThroughTelegram_(node);
  view.appendChild(node);
  try { window.scrollTo(0, 0); } catch (e) {}
}
function paintTop() {
  const on = stage === "form";
  topEl.classList.toggle("quiet", !on);
  counter.textContent = on ? "Шаг " + (step + 1) + " из " + BLOCKS.length : "";
  barFill.style.width = on ? Math.round((step + 1) / BLOCKS.length * 100) + "%" : "0";
}

/* ——— Телеграм ———
   Страница обычная и работает в любом браузере. Если её открыли внутри
   Телеграма мини-приложением, берём оттуда ник и ID, чтобы человек
   не набирал ник руками и не ошибся в нём. */
function tgApp() { return window.Telegram && window.Telegram.WebApp; }
function inTg_() { const tg = tgApp(); return !!(tg && tg.initData); }
function tgUser() {
  const tg = tgApp();
  return (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || {};
}
function takeTg_() {
  if (!inTg_()) return;
  const tg = tgApp();
  try {
    tg.ready(); tg.expand();
    const bg = getComputedStyle(document.documentElement).getPropertyValue("--ground").trim();
    if (bg && tg.setHeaderColor) tg.setHeaderColor(bg);
    if (bg && tg.setBackgroundColor) tg.setBackgroundColor(bg);
  } catch (e) {}
  const u = tgUser();
  if (u.id && !tgId) tgId = String(u.id);
  if (u.username && !nick) {
    nick = "@" + u.username;
    const f = document.getElementById("f-nick");
    if (f && !f.value) f.value = nick;
  }
  saveState();
}
window.__tgReady = takeTg_;

/* Правовые страницы внутри мини-приложения открываем средствами Телеграма:
   обычный target=_blank там срабатывает не на всех клиентах. */
function linksThroughTelegram_(node) {
  node.querySelectorAll("a").forEach(a => a.addEventListener("click", (e) => {
    const href = a.getAttribute("href");
    if (!href || href.indexOf("http") !== 0) return;
    const tg = tgApp();
    if (!inTg_()) return;
    if (href.indexOf("https://t.me/") === 0) {
      if (tg.openTelegramLink) { e.preventDefault(); tg.openTelegramLink(href); }
      return;
    }
    if (tg.openLink) { e.preventDefault(); tg.openLink(href); }
  }));
}

/* ——— вопрос ——— */
function isOther_(o) { return o === "Другое" || o === "другое"; }

function qHtml_(q) {
  const v = A[q.n];
  const label = `<div class="q-label" id="ql-${q.n}">${q.label}${q.req ? ' <span class="req" title="Обязательный вопрос">*</span>' : ""}</div>`;
  const hint = q.hint ? `<div class="q-hint">${q.hint}</div>` : "";

  if (q.type === "text") {
    return `<div class="q" data-q="${q.n}">${label}${hint}
      <textarea data-n="${q.n}" rows="4" maxlength="1500" aria-labelledby="ql-${q.n}">${esc(v || "")}</textarea></div>`;
  }
  if (q.type === "scale") {
    const tiles = [];
    for (let i = 1; i <= 10; i++) {
      const cls = v === i ? " on" : (v > i ? " pre" : "");
      const css = `--c:${SCALE10.c[i - 1]};--m:${SCALE10.m[i - 1]};--t:${SCALE10.t[i - 1]};--k:${SCALE10.k[i - 1]}`;
      tiles.push(`<button type="button" class="tile${cls}" style="${css}" aria-pressed="${v === i}" data-n="${q.n}" data-v="${i}">${i}</button>`);
    }
    return `<div class="q" data-q="${q.n}">${label}${hint}
      <div class="scale10" role="group" aria-labelledby="ql-${q.n}">${tiles.join("")}</div>
      ${q.lo || q.hi ? `<div class="scale-ends"><span>${q.lo || ""}</span><span>${q.hi || ""}</span></div>` : ""}</div>`;
  }
  if (q.type === "check") {
    return `<div class="q" data-q="${q.n}">
      <label class="cb"><input type="checkbox" data-n="${q.n}"${v ? " checked" : ""}><span>${q.label}</span></label></div>`;
  }
  /* one и multi */
  const multi = q.type === "multi";
  const picked = multi ? (Array.isArray(v) ? v : []) : (v ? [v] : []);
  const full = multi && q.max && picked.length >= q.max;
  const kind = multi ? (q.max ? "" : `<div class="q-hint">Можно выбрать несколько</div>`) : "";
  const opts = q.opts.map((o, i) => {
    const on = picked.indexOf(o) !== -1;
    return `<button type="button" class="opt${on ? " on" : ""}${full && !on ? " off" : ""}" aria-pressed="${on}" data-n="${q.n}" data-i="${i}"><span>${esc(o)}</span></button>`;
  }).join("");
  const hasOther = q.opts.some(isOther_);
  const otherOn = picked.some(isOther_);
  return `<div class="q" data-q="${q.n}">${label}${hint}${kind}
    <div class="opts${multi ? " multi" : ""}" role="group" aria-labelledby="ql-${q.n}">${opts}</div>
    ${q.max ? `<div class="q-note" data-full="${q.n}"${full ? "" : " hidden"}>Выбрано ${q.max === 3 ? "три" : q.max}. Чтобы отметить другой вариант, снимите один из выбранных.</div>` : ""}
    ${hasOther ? `<input type="text" data-other="${q.n}" maxlength="200" placeholder="Напишите, что именно" aria-label="Другое: напишите, что именно" value="${esc(OTHER[q.n] || "")}"${otherOn ? "" : " hidden"}>` : ""}
  </div>`;
}

function emptyQ_(q) {
  const v = A[q.n];
  if (q.type === "text") return String(v || "").trim().length < 2;
  if (q.type === "scale") return !v;
  if (q.type === "one") return !v;
  if (q.type === "multi") return !Array.isArray(v) || !v.length;
  return false;
}

      </div>
      <div class="foot">

        <p class="fine center" id="hint" role="status"></p>

      </div>
    </div>`);

  const hint = n.querySelector("#hint");
  function warn(msg) { hint.textContent = msg; hint.classList.add("err"); }
  function calm() { hint.textContent = ""; hint.classList.remove("err"); }
  const byN = {};
  b.qs.forEach(q => { byN[q.n] = q; });

  /* свой ответ */
  n.querySelectorAll("textarea[data-n]").forEach(t => t.addEventListener("input", () => {

  /* шкала */
  n.querySelectorAll(".tile").forEach(c => c.addEventListener("click", () => {
    const id = c.getAttribute("data-n");
    const val = Number(c.getAttribute("data-v"));
    const box = c.parentNode;
    /* Вторая оценка необязательная: повторное нажатие её снимает. */
    const off = A[id] === val && !byN[id].req;
    if (off) delete A[id]; else A[id] = val;
    for (let i = 0; i < box.children.length; i++) {
      const on = !off && i === val - 1;
      box.children[i].classList.toggle("on", on);
      box.children[i].classList.toggle("pre", !off && i < val - 1);
      box.children[i].setAttribute("aria-pressed", on ? "true" : "false");
    }
    box.classList.remove("err"); calm(); saveState();
  }));

  /* варианты */
  n.querySelectorAll(".opt").forEach(c => c.addEventListener("click", () => {
    const id = c.getAttribute("data-n");
    const q = byN[id];
    const o = q.opts[Number(c.getAttribute("data-i"))];
    const box = c.parentNode;
    if (q.type === "one") {
      A[id] = o;
    } else {
      const cur = Array.isArray(A[id]) ? A[id].slice() : [];
      const at = cur.indexOf(o);
      if (at !== -1) cur.splice(at, 1);
      else {
        /* Больше, чем разрешено, выбрать нельзя: лишнее нажатие ничего не меняет. */
        if (q.max && cur.length >= q.max) return;
        cur.push(o);
      }
      /* В таблицу варианты идут в том порядке, в каком стоят в анкете. */
      cur.sort((x, y) => q.opts.indexOf(x) - q.opts.indexOf(y));
      A[id] = cur;
    }
    const picked = q.type === "one" ? [A[id]] : A[id];
    const full = q.type === "multi" && q.max && picked.length >= q.max;
    for (let i = 0; i < box.children.length; i++) {
      const on = picked.indexOf(q.opts[i]) !== -1;
      box.children[i].classList.toggle("on", on);
      box.children[i].classList.toggle("off", !!full && !on);
      box.children[i].setAttribute("aria-pressed", on ? "true" : "false");
    }
    const note = n.querySelector('[data-full="' + id + '"]');
    if (note) note.hidden = !full;
    const other = n.querySelector('[data-other="' + id + '"]');
    if (other) {
      const show = picked.some(isOther_);
      other.hidden = !show;
      if (show && !other.value) { try { other.focus(); } catch (e) {} }
    }
    box.classList.remove("err"); calm(); saveState();
  }));
  n.querySelectorAll("[data-other]").forEach(i => i.addEventListener("input", () => {
    OTHER[i.getAttribute("data-other")] = i.value; saveState();
  }));

  /* галочка «можно цитировать» */
  n.querySelectorAll('input[type="checkbox"][data-n]').forEach(c => c.addEventListener("change", () => {
    A[c.getAttribute("data-n")] = c.checked; saveState();
  }));

  const fNick = n.querySelector("#f-nick");
  const pd = n.querySelector("#cb-pd");
  const pdLabel = n.querySelector("#cb-pd-l");
  if (fNick) fNick.addEventListener("input", () => { nick = fNick.value; fNick.classList.remove("err"); calm(); saveState(); });
  if (pd) pd.addEventListener("change", () => {
    acceptPd = pd.checked;
    if (pd.checked) { pdLabel.classList.remove("err"); calm(); }
    saveState();
  });

  const btn = n.querySelector("#next");
  btn.addEventListener("click", () => {
    /* Первый пропущенный обязательный вопрос подсвечиваем и подводим к нему
       экран: подсказку под кнопкой не видно, если вопрос остался выше. */
    let bad = null;
    b.qs.forEach(q => {
      if (!q.req || !emptyQ_(q)) return;
      const box = n.querySelector('[data-q="' + q.n + '"]');
      const mark = box && box.querySelector("textarea, .scale10, .opts");
      if (mark) mark.classList.add("err");
      if (!bad) bad = box;
    });
    if (last && String(nick || "").trim().length < 2) {
      fNick.classList.add("err");
      if (!bad) bad = n.querySelector('[data-q="nick"]');
    }
    if (bad) {
      warn("Остался вопрос без ответа. Он выделен красным.");
      if (bad.scrollIntoView) bad.scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }
    if (!last) { step++; saveState(); formScreen(); return; }
    if (!pd.checked) {
      /* Без согласия на обработку данных анкету принимать нельзя. */
      pdLabel.classList.add("err");
      if (pdLabel.scrollIntoView) pdLabel.scrollIntoView({ behavior: "smooth", block: "center" });
      warn("Отметьте согласие на обработку персональных данных.");
      return;
    }
    const hp = n.querySelector("#f-website");
    btn.disabled = true;
    btn.textContent = "Отправляю…";
    calm();
    sendForm(hp ? hp.value : "").then(() => {
      sent = true; stage = "done"; saveState(); done();
    }).catch((err) => {
      btn.disabled = false;
      btn.innerHTML = 'Отправить анкету&nbsp;<span aria-hidden="true">→</span>';
      warn(err && err.message === "no-url"
        ? "Анкета пока не принимается: приём ответов ещё не подключён. Ваши ответы сохранены."
        : "Не получилось отправить. Проверьте интернет и нажмите ещё раз. Ваши ответы сохранены.");
    });
  });
  n.querySelector("#back").addEventListener("click", () => {
    if (step > 0) { step--; saveState(); formScreen(); return; }
    cover();
  });
  render(n);
  /* Ник из Телеграма мог приехать позже, чем отрисовался шаг. */
  if (last) takeTg_();
}

/* ——— отправка ———
   Тем же способом, что site.js шлёт заявки: POST с типом text/plain.
   Такой запрос «простой», браузер не шлёт перед ним OPTIONS, на который
   Apps Script отвечать не умеет. redirect: "manual" — потому что скрипт
   отвечает кодом 302 на домен, который в ряде стран недоступен: сам POST
   доходит и строка записывается, а чтение ответа падает. Останавливаемся
   на самом 302: он приходит только после того, как doPost отработал. */
function answer_(q) {
  const v = A[q.n];
  if (q.type === "check") return v ? "да" : "";
  if (q.type === "scale") return v || "";
  const more = String(OTHER[q.n] || "").trim();
  const name = o => (isOther_(o) && more ? o + ": " + more : o);
  if (q.type === "multi") return (Array.isArray(v) ? v : []).map(name);
  if (q.type === "one") return v ? name(v) : "";
  return String(v || "").trim();
}
function payload_(website) {
  const answers = {};
  BLOCKS.forEach(b => b.qs.forEach(q => { answers["q" + q.n] = answer_(q); }));
  return {
    type: "pe_anketa",
    website: website || "",
    nick: String(nick || "").trim(),
    tg_id: tgId || "",
    answers: answers,
    accept_pd: !!acceptPd,
    consent_ts: new Date().toISOString(),
    doc_version_consent: CONFIG.docVersionConsent,
    page: location.href
  };
}
function sendForm(website) {
  if (!CONFIG.sheetUrl) return Promise.reject(new Error("no-url"));
  return fetch(CONFIG.sheetUrl, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload_(website)),
    redirect: "manual",
    keepalive: true
  }).then(res => {
    if (res.type !== "opaqueredirect" && !res.ok) throw new Error("HTTP " + res.status);
    return true;
  });
}

/* ——— спасибо ——— */
function done() {
  stage = "done";
  paintTop();
  const n = el(`
    <div class="card">
      <div class="hero"><h2>${DONE.title}</h2></div>
      <div class="copy">
        ${DONE.text.map(p => `<p>${p}</p>`).join("")}
      </div>
    </div>`);
  render(n);
}

function boot() {
  document.getElementById("brand-ava").src = AVATAR;
  const s = loadState();
  if (s) {
    Object.keys(s.a || {}).forEach(k => { A[k] = s.a[k]; });
    Object.keys(s.other || {}).forEach(k => { OTHER[k] = s.other[k]; });
    nick = s.nick || "";
    tgId = s.tgId || "";
    acceptPd = !!s.pd;
    sent = !!s.sent;
    step = Math.max(0, Math.min(Number(s.step) || 0, BLOCKS.length - 1));
  }
  takeTg_();
  if (sent) { done(); return; }
  /* Вернулась к начатой анкете — сразу тот шаг, на котором остановилась. */
  if (s && s.stage === "form") { formScreen(); return; }
  cover();
}
