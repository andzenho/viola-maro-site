<!-- Тильда, страница violamaro.com/bf, один блок T123 «HTML-код».
     Внутри на весь экран показывается violamaro.ru/bf/, в адресной строке остаётся violamaro.com/bf.
     Метки рекламы (?utm_…) передаются внутрь.
     «Подробнее о программе» у «Ключей» открывает поверх страницу violamaro.com/keys-bf. -->
<style>
  html, body { overflow: hidden !important; height: 100%; }
  #bf-frame { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh; border: 0; z-index: 2147483000; background: #fff; }
  #bf-pop { position: fixed; inset: 0; z-index: 2147483001; display: none; background: rgba(0,0,0,.55); }
  #bf-pop.on { display: block; }
  #bf-pop-box { position: absolute; inset: 16px; max-width: 1100px; margin: 0 auto; background: #fff; border-radius: 20px; overflow: hidden; }
  #bf-pop iframe { width: 100%; height: 100%; border: 0; display: block; }
  #bf-pop-x { position: absolute; top: 12px; right: 12px; z-index: 2; display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 20px;
    border: 0; border-radius: 999px; background: #212322; color: #fff; font: 700 16px/1 Manrope, Arial, sans-serif; cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.25); }
  @media (max-width: 640px) { #bf-pop-box { inset: 0; border-radius: 0; } }
</style>
<iframe id="bf-frame" title="Чёрная пятница от Виолы Маро" allow="payment; clipboard-write"></iframe>
<div id="bf-pop" role="dialog" aria-modal="true" aria-label="Подробнее о программе">
  <div id="bf-pop-box"><button type="button" id="bf-pop-x">× Закрыть</button><iframe id="bf-pop-f" title="Подробнее о программе"></iframe></div>
</div>
<script>
(function () {
  var POPUPS = { klyuchi: "https://violamaro.com/keys-bf" };   // программа → страница в окне
  var frame = document.getElementById("bf-frame"), pop = document.getElementById("bf-pop"), popF = document.getElementById("bf-pop-f");
  frame.src = "https://violamaro.ru/bf/" + location.search + location.hash;
  function hello() { frame.contentWindow.postMessage({ type: "bf-host", popups: Object.keys(POPUPS) }, "*"); }
  frame.addEventListener("load", hello);
  function close() { pop.classList.remove("on"); popF.src = "about:blank"; frame.focus(); }
  window.addEventListener("message", function (e) {
    if (e.source !== frame.contentWindow) return;
    var d = e.data || {};
    if (d.type === "bf-ready") hello();
    if (d.type === "bf-open" && POPUPS[d.key]) { popF.src = POPUPS[d.key]; pop.classList.add("on"); document.getElementById("bf-pop-x").focus(); }
  });
  document.getElementById("bf-pop-x").addEventListener("click", close);
  pop.addEventListener("click", function (e) { if (e.target === pop) close(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && pop.classList.contains("on")) close(); });
})();
</script>
