name: Публикация на GitHub Pages

# Сборка для привязанного тестового домена violamaro.ru.
# Индексация пока запрещена: это стенд согласования, а не финальная публикация.

on:
  push:
    # Публикуем только подтверждённый main. Рабочая ветка integration-update
    # должна лишь хранить изменения и не заменять опубликованный сайт.
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установить Pillow
        run: pip install --quiet pillow

      # Все страницы практикума собираются в оформлении --theme barhat (красное
      # с белым): полная оплата (/), бронь (/bron), внутренняя рассрочка
      # (/rassrochka), заявка (/zayavka) и анкета предзаписи (/predzapis).
      # Прежнее оформление: --theme more.
      - name: Собрать сайт с оплатой
        run: python3 build.py --theme barhat --noindex

      # Страница заявки /zayavka/ (бывшая новая главная, правки 19.10): таймер
      # цены по заявке, истории, форма заявки, ?uid=. Первый экран берёт
      # из только что собранной главной, поэтому идёт сразу после неё.
      - name: Собрать страницу заявки
        run: python3 glavnaya.py --noindex

      # Страница клуба «Опора» (/opora/, ТЗ 04.11.2026): своё оформление
      # в build-assets/opora/, пишет только site/opora/. Берёт шрифты, подвал
      # и cookie из только что собранного сайта, поэтому идёт до oplata.py.
      - name: Собрать страницу клуба «Опора»
        run: python3 opora.py --noindex

      # Страница-заявка для подписчиков Кабинета. Берёт стили, шрифты и фото
      # из только что собранного основного сайта, поэтому идёт сразу после него.
      - name: Собрать страницу заявки для Кабинета
        run: python3 kabinet.py

      - name: Собрать редирект со старой страницы /pre
        run: python3 build.py --mode pre --out site/pre --base /pre --noindex

      - name: Собрать страницу брони
        run: python3 build.py --mode bron --theme barhat --out site/bron --base /bron --noindex

      # Старая анкета предзаписи (/predzapis) с 25.10 только редирект на
      # /zayavka/ с метками ссылки, как /pre: ссылки в канале ещё живы.
      - name: Перенаправить /predzapis на заявку
        run: python3 build.py --mode pre --out site/predzapis --base /predzapis --noindex

      - name: Собрать страницу внутренней рассрочки
        run: python3 build.py --mode rassrochka --theme barhat --out site/rassrochka --base /rassrochka --docs-root --noindex


      # Прежний адрес тестовой страницы оформления: та же сборка, что
      # и главная. Оставлен, чтобы разосланная ссылка не сломалась.
      - name: Собрать копию главной по адресу /dizayn
        run: python3 build.py --theme barhat --out site/dizayn --base /dizayn --docs-root --noindex

      # Три страницы оплаты (/, /rassrochka/, /bron/) по одному шаблону:
      # оффер и форма с выбором тарифа, дальше окно «Способ оплаты».
      # Идёт после всех сборок: главную уже прочитал glavnaya.py.
      - name: Пересобрать страницы оплаты
        run: python3 oplata.py

      - name: Добавить мини-аппы
        run: |
          mkdir -p site/test site/koleso site/test2
          cp miniapps/test/index.html site/test/index.html
          cp miniapps/koleso/index.html site/koleso/index.html
          cp miniapps/test2/index.html site/test2/index.html

      # Тест 3.0 «Эмпат ли вы на самом деле?»: отдельная страница, тест 2.0
      # не трогает. Голосовые Виолы лежат рядом, в audio/.
      - name: Добавить тест 3.0
        run: |
          mkdir -p site/test3
          cp -r miniapps/test3/. site/test3/
          rm -f site/test3/README.md site/test3/audio/.gitkeep

      # Анкета участниц потока: одна страница, свой приёмник и своя таблица.
      # В меню сайта её нет, индексация запрещена в самой странице.
      - name: Добавить анкету участниц
        run: |
          mkdir -p site/anketa
          cp miniapps/anketa/index.html site/anketa/index.html

      # Анкета для интервью (кастдевов): ответы в таблицу заявок, лист «Кастдев».
      - name: Добавить анкету для интервью
        run: |
          mkdir -p site/intervyu
          cp miniapps/intervyu/index.html site/intervyu/index.html

      # Предзапись на «Женщину-лидера» (/zhl/): анкета, заявки в лист
      # «Предзапись с сайта», после отправки переход в закрытый канал.
      - name: Добавить предзапись на «Женщину-лидера»
        run: |
          mkdir -p site/zhl
          cp miniapps/zhl/index.html site/zhl/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
