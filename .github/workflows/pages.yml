name: Публикация на GitHub Pages

# Сборка для привязанного тестового домена violamaro.ru.
# Индексация пока запрещена: это стенд согласования, а не финальная публикация.

on:
  push:
    # Публикуем только подтверждённый main. Рабочая ветка integration-update
    # должна лишь хранить изменения и не заменять опубликованный сайт.
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установить Pillow
        run: pip install --quiet pillow

      # Все страницы практикума собираются в новом оформлении: полная оплата (/),
      # бронь (/bron), внутренняя рассрочка (/rassrochka) и заявка (/zayavka).
      - name: Собрать сайт с оплатой
        run: python3 build.py --theme more --noindex

      - name: Собрать редирект со старой страницы /pre
        run: python3 build.py --mode pre --out site/pre --base /pre --noindex

      - name: Собрать страницу брони
        run: python3 build.py --mode bron --theme more --out site/bron --base /bron --noindex

      # Анкета предзаписи: без цен и оплаты, после анкеты открывается
      # закрытый канал. Адрес /pre при этом остаётся редиректом на заявку.
      - name: Собрать страницу анкеты предзаписи
        run: python3 build.py --mode predzapis --theme more --out site/predzapis --base /predzapis --docs-root --noindex

      - name: Собрать страницу внутренней рассрочки
        run: python3 build.py --mode rassrochka --theme more --out site/rassrochka --base /rassrochka --docs-root --noindex

      - name: Собрать страницу заявки
        run: python3 build.py --mode zayavka --theme more --out site/zayavka --base /zayavka --noindex

      # Прежний адрес тестовой страницы нового оформления: та же сборка,
      # что и главная. Оставлен, чтобы разосланная ссылка не сломалась.
      - name: Собрать копию главной по адресу /dizayn
        run: python3 build.py --theme more --out site/dizayn --base /dizayn --docs-root --noindex

      - name: Добавить мини-аппы
        run: |
          mkdir -p site/test site/koleso site/test2
          cp miniapps/test/index.html site/test/index.html
          cp miniapps/koleso/index.html site/koleso/index.html
          cp miniapps/test2/index.html site/test2/index.html

      # Анкета участниц потока: одна страница, свой приёмник и своя таблица.
      # В меню сайта её нет, индексация запрещена в самой странице.
      - name: Добавить анкету участниц
        run: |
          mkdir -p site/anketa
          cp miniapps/anketa/index.html site/anketa/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
