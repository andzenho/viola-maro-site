name: Публикация на GitHub Pages

# Сборка для привязанного тестового домена violamaro.ru.
# Индексация пока запрещена: это стенд согласования, а не финальная публикация.

on:
  push:
    # Публикуем только подтверждённый main. Рабочая ветка integration-update
    # должна лишь хранить изменения и не заменять опубликованный сайт.
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установить Pillow
        run: pip install --quiet pillow

      - name: Собрать сайт с оплатой
        run: python3 build.py --noindex

      - name: Собрать версию предзаписи
        run: python3 build.py --mode pre --out site/pre --base /pre --noindex

      - name: Собрать страницу брони
        run: python3 build.py --mode bron --out site/bron --base /bron --noindex

      - name: Собрать страницу заявки
        run: python3 build.py --mode zayavka --out site/zayavka --base /zayavka --noindex

      - name: Добавить мини-аппы
        run: |
          mkdir -p site/test site/koleso
          cp miniapps/test/index.html site/test/index.html
          cp miniapps/koleso/index.html site/koleso/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
